        // --- Anti-spam probability + cooldown gate ---
        function commentAllowed(type, cooldownMinutes, probability) {
            const now = Date.now();
            const last = lastCommentAt[type] || 0;
            if (now - last < cooldownMinutes * 60000) return false;
            if (Math.random() > probability) return false;
            lastCommentAt[type] = now;
            return true;
        }

        // --- Memory trimmer (hard cap) ---
        function trimTo(str, max) {
            str = safeStr(str);
            if (str.length <= max) return str;
            const parts = str.split(' | ');
            while (parts.length > 1 && parts.join(' | ').length > max) parts.shift();
            return parts.join(' | ').slice(-max);
        }

        // --- Memory summarizer (AI compresses when a category is ~full) ---
        const summarizing = {};
        function maybeSummarize(category) {
            const content = category === 'facts' ? memFacts : category === 'habits' ? memHabits : memRules;
            const limit = MEM_LIMITS[category];
            if (content.length < limit * 0.85 || summarizing[category] || isApiPaused()) return;
            summarizing[category] = true;
            const prompt = `[SYSTEM MEMORY SUMMARIZER]: Neeche user ki "${category}" memory limit ke paas hai. ` +
                `Isko adhe size tak compress karke ek concise Hinglish summary do — saari important details bachake. Sirf compressed text likho, koi JSON nahi.\n\n${content}`;
            fetch(`https://generativelanguage.googleapis.com/v1beta/models/${LIGHT_MODEL_NAME}:generateContent?key=${API_KEY}`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            })
            .then(r => r.json())
            .then(data => {
                const summary = data?.candidates?.[0]?.content?.parts?.[0]?.text;
                if (summary && summary.length > 20) {
                    const clean = summary.trim().slice(0, limit);
                    if (category === 'facts') { memFacts = clean; db.ref('buddy/memory/facts').set(clean); }
                    else if (category === 'habits') { memHabits = clean; db.ref('buddy/memory/habits').set(clean); }
                    else { memRules = clean; db.ref('buddy/memory/rules').set(clean); }
                    console.log(`Memory '${category}' summarized:`, clean.length, 'chars');
                }
            })
            .catch(e => console.error("Summarize fail:", e))
            .finally(() => { summarizing[category] = false; });
        }

        // --- Short-term history ---
        function pushHistory(role, text) {
            chatHistory.push({ role, text: safeStr(text).slice(0, 300) });
            if (chatHistory.length > HISTORY_MAX) chatHistory.shift();
        }
        /* ================= 9. TASK / REMINDER ENGINE (Progressive, Never Skips) ================= */
        // v3.1: FIX — pehle sirf strict 24-hour "HH:MM" string accept hoti thi, aur "X minute baad"
        // jaisi relative request ke liye AI ko khud current time dekh ke ganit karna padta tha (error-prone,
        // AM/PM format bhej de toh silently fail ho jaata tha, koi error kabhi dikhta hi nahi tha).
        // Ab do reliable raaste hain:
        //   (a) deadline_minutes_from_now (number) — relative reminders ke liye, AI ko koi clock-math
        //       karne ki zaroorat nahi, seedha "kitne minute baad" bhejo, code khud calculate karta hai.
        //   (b) deadline (string) — absolute clock-time ke liye, ab 24-hour ("14:30") AUR 12-hour
        //       AM/PM ("2:30 PM", "2:30pm", "02:30 PM") dono formats accept karta hai.
        // Agar dono hi missing/invalid hon, silently fail nahi hota — activity log me clear error aata hai.
        function parseFlexibleTime(str) {
            str = safeStr(str).trim();
            // 24-hour: "14:30", "9:05"
            let m = str.match(/^(\d{1,2}):(\d{2})$/);
            if (m) {
                const h = parseInt(m[1], 10), mi = parseInt(m[2], 10);
                if (h >= 0 && h <= 23 && mi >= 0 && mi <= 59) return { hour: h, minute: mi };
                return null;
            }
            // 12-hour with AM/PM: "2:30 PM", "2:30pm", "02:30 A.M.", "12:00am"
            m = str.match(/^(\d{1,2}):(\d{2})\s*([APap])\.?[Mm]\.?$/);
            if (m) {
                let h = parseInt(m[1], 10);
                const mi = parseInt(m[2], 10);
                const isPM = /p/i.test(m[3]);
                if (h < 1 || h > 12 || mi < 0 || mi > 59) return null;
                if (h === 12) h = 0; // 12 AM = 00, 12 PM handled by +12 below
                if (isPM) h += 12;
                return { hour: h, minute: mi };
            }
            return null;
        }

        function addTask(t) {
            const task = safeStr(t.task);
            if (!task) return false;

            const now = new Date();
            let dl = null;

            // Path (a) — relative duration, deterministic, no string-parsing risk at all.
            const relMin = safeNum(t.deadline_minutes_from_now, NaN);
            if (!isNaN(relMin) && relMin > 0) {
                dl = new Date(now.getTime() + Math.round(relMin) * 60000);
            } else {
                // Path (b) — absolute clock time, now tolerant of 12h/24h formats.
                const deadlineStr = safeStr(t.deadline);
                const parsed = parseFlexibleTime(deadlineStr);
                if (!parsed) {
                    logActivity(`⚠️ Task "${task}" save nahi hua — deadline samajh nahi aayi ("${deadlineStr || 'khaali'}"). AI ko deadline_minutes_from_now ya sahi HH:MM format use karna chahiye tha.`, 'error');
                    return false;
                }
                dl = new Date(now.getFullYear(), now.getMonth(), now.getDate(), parsed.hour, parsed.minute);
                if (dl.getTime() <= now.getTime()) dl.setDate(dl.getDate() + 1); // time passed today → tomorrow
            }

            const warnOffsets = [10, 30, 60]; // escalating warn points (minutes before)
            const warnTs = warnOffsets.map(o => dl.getTime() - o * 60000).filter(ts => ts > now.getTime());

            const id = 'task_' + Date.now();
            const deadlineHumanFallback = dl.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true }) +
                (dl.getDate() !== now.getDate() ? ' (kal)' : '');
            const entry = {
                id, task,
                deadlineTs: dl.getTime(),
                deadlineHuman: safeStr(t.deadline_human) || deadlineHumanFallback,
                nature: safeStr(t.nature),
                selfFulfilling: !!t.self_fulfilling,
                warnTs, warnIdx: 0,
                stage: 0, // 0=normal, 1=warned, 2=urgent, 3=overdue
                done: false, remindedFinal: false,
                muted: false, timesReminded: 0,
                createdAt: now.getTime()
            };
            savedTasks[id] = entry;
            db.ref('buddy/tasks/' + id).set(entry);
            logActivity('📝 Naya task set hua: "' + task + '" (deadline ' + entry.deadlineHuman + ')', 'task');
            return true;
        }

        // v3: sanity check for AI-provided deadline strings (accepts both 12h and 24h now)
        function isValidDeadline(str) {
            return parseFlexibleTime(str) !== null;
        }

        // Task checker — har 1 minute, MUTE ko bypass karta hai (system override)
        function checkTasks() {
            if (conversationActive) return; // live baat-cheet chal rahi hai — reminder is baad rok do, agle 1-min tick pe phir try hoga
            const now = Date.now();
            for (const id of Object.keys(savedTasks)) {
                const t = savedTasks[id];
                // muted: user ne khud "bas mat bolo" bola tha — ab is task ke liye koi
                // reminder (warning/deadline/overdue) kabhi nahi firega, jab tak dobara
                // add na ho. Task delete nahi hota, bas chup ho jaata hai.
                if (!t || t.done || t.muted) continue;

                // Progressive warnings
                if (t.warnIdx < (t.warnTs || []).length && now >= t.warnTs[t.warnIdx]) {
                    t.warnIdx++; t.stage = 1; t.timesReminded = (t.timesReminded || 0) + 1;
                    db.ref('buddy/tasks/' + id).set(t);
                    const minsLeft = Math.max(1, Math.round((t.deadlineTs - now) / 60000));
                    enqueueCall(`[SYSTEM OVERRIDE TASK id:${id}]: "${t.task}" ka time ${minsLeft} minute me aa raha hai (deadline: ${t.deadlineHuman}). Ye is task ke liye ${t.timesReminded}wa reminder hai. User ko halka se remind karo — daantna nahi abhi. Agar user pehle hi bol chuka hai "itna baar mat bolo"/"mat yaad dilao" jaisa kuch is task ke liye, toh mute_task_id: "${id}" bhejo aur kuch mat bolo. Nature: ${t.nature}`, { isSystemOverride: true });
                    continue;
                }

                // Deadline hit — aggressive (action tasks) / content-delivery (self-fulfilling tasks)
                if (!t.remindedFinal && now >= t.deadlineTs) {
                    t.remindedFinal = true; t.stage = 2;
                    if (t.selfFulfilling) {
                        // Buddy khud is task ko "poora" karta hai (gaana/story/joke sunana) —
                        // is waqt speak karna hi completion hai, isliye turant done mark karo.
                        // Isse pehle ye bug tha: task kabhi "done" nahi hota tha (AI ke paas task id
                        // hi nahi jaata tha complete_task_id bhejne ke liye), toh overdue-nagging loop
                        // ISI cheez ko baar-baar bolta rehta tha gaana ho jaane ke baad bhi.
                        t.done = true;
                        db.ref('buddy/tasks/' + id).set(t);
                        enqueueCall(`[SYSTEM OVERRIDE TASK DEADLINE — SELF-FULFILLING id:${id}]: "${t.task}" ka time ho gaya hai (${t.deadlineHuman}). Ye khud tumhara kaam hai (jaise gaana/story/joke sunana) — ISI waqt seedha wahi content de do speech_text me, koi daant/reminder nahi chahiye. Ye task ye response dene ke saath hi complete maana jaayega, dobara mention mat karna. Nature: ${t.nature}`, { isSystemOverride: true });
                    } else {
                        t.timesReminded = (t.timesReminded || 0) + 1;
                        db.ref('buddy/tasks/' + id).set(t);
                        enqueueCall(`[SYSTEM OVERRIDE TASK DEADLINE id:${id}]: "${t.task}" ka TIME HO GAYA (${t.deadlineHuman})! Ye is task ke liye ${t.timesReminded}wa reminder hai. User ko aggressively bolo ki ab jaana/karna hi hai. Agar user pehle hi mana kar chuka hai is task ke reminders ke liye, toh mute_task_id: "${id}" bhejo aur kuch mat bolo. Nature: ${t.nature}`, { isSystemOverride: true });
                    }
                    continue;
                }

                // Overdue nagging (first 4 quick nags har 15 min, phir rare mode — har 2.5 ghante ek yaad)
                if (t.remindedFinal && now > t.deadlineTs) {
                    t.nagCount = t.nagCount || 0;
                    const lastNag = t.lastNagAt || 0;
                    const inRareMode = t.nagCount >= 4;
                    const interval = inRareMode ? 150 * 60000 : 15 * 60000;
                    if (now - lastNag > interval) {
                        t.nagCount++; t.lastNagAt = now; t.stage = 3; t.timesReminded = (t.timesReminded || 0) + 1;
                        db.ref('buddy/tasks/' + id).set(t);
                        const tone = inRareMode ? 'ek rare halka reminder do (annoying mat bano)' : 'thoda gussa/daant allowed';
                        enqueueCall(`[SYSTEM OVERRIDE TASK OVERDUE id:${id}]: "${t.task}" abhi tak pending hai! Deadline ${t.deadlineHuman} thi. Ye is task ke liye ${t.timesReminded}wa reminder hai — agar user pehle hi mana kar chuka hai isko dobara mat bolne ke liye, toh mute_task_id: "${id}" bhejo aur kuch mat bolo. Nahi toh user ko phir se todo — ${tone}.`, { isSystemOverride: true });
                    }
                }
            }
        }

        // "Abhi bata dena" instant request detect — bypass everything
        function isInstantRequest(text) {
            const t = safeStr(text).toLowerCase();
            return /abhi (bata|bolo|bta)|turant bata|foran bata|jaldi bata|fatafat bata/.test(t);
        }

        /* ================= v3: STRUCTURED PROFILE + SEMANTIC MEMORY + TIMELINE + CAPSULES ================= */
        function summarizeProfile() {
            const p = userProfile || {};
            const parts = [];
            if (p.name) parts.push(`name: ${p.name}`);
            if (p.school) parts.push(`school: ${p.school}`);
            if (p.crush) parts.push(`crush: ${p.crush}`);
            if (p.dailyRoutine) parts.push(`routine: ${p.dailyRoutine}`);
            if (Array.isArray(p.goals) && p.goals.length) parts.push(`goals: ${p.goals.join(', ')}`);
            if (Array.isArray(p.hobbies) && p.hobbies.length) parts.push(`hobbies: ${p.hobbies.join(', ')}`);
            if (Array.isArray(p.friends) && p.friends.length) parts.push(`friends: ${p.friends.join(', ')}`);
            if (Array.isArray(p.importantDates) && p.importantDates.length) parts.push(`important dates: ${p.importantDates.join(', ')}`);
            return parts.length ? parts.join(' | ') : '(profile empty — dheere dheere fields bharo)';
        }

        function applyProfileUpdate(upd) {
            const field = safeStr(upd.field);
            const action = safeStr(upd.action).toLowerCase() || 'set';
            const value = safeStr(upd.value).trim();
            if (!field || !value) return;
            if (!(field in userProfile)) return; // unknown field — skip
            if (PROFILE_ARRAY_FIELDS.includes(field)) {
                if (!Array.isArray(userProfile[field])) userProfile[field] = [];
                if (action === 'remove') {
                    userProfile[field] = userProfile[field].filter(x => safeStr(x).toLowerCase() !== value.toLowerCase());
                } else {
                    // add (default) — dedupe
                    if (!userProfile[field].some(x => safeStr(x).toLowerCase() === value.toLowerCase())) {
                        userProfile[field].push(value);
                    }
                }
            } else {
                userProfile[field] = value;
            }
            db.ref('buddy/profile').set(userProfile);
            logActivity('🧠 Profile update: ' + field + ' ' + action + ' "' + value.slice(0, 40) + '"', 'memory');
            appendTimeline(`profile ${field} ${action}: ${value}`, 'profile');
        }

        // v3.2: PEOPLE DIRECTORY — structured, episodic memory for named individuals (friends/
        // family). Alag se isliye hai kyunki "Rahul ka birthday kab hai" jaisa sawal seedha
        // lookup se answer ho sake, aur "kal Rahul ke saath bahar gaya tha" jaisi cheezein
        // per-person timeline me track ho sakein — na ki ek flat text blob me kho jaayein.
        function summarizePeople() {
            const people = (userProfile && userProfile.people) || {};
            const names = Object.keys(people);
            if (names.length === 0) return '(koi naamzad dost/family member abhi tak note nahi hui)';
            return names.map(name => {
                const p = people[name];
                const rel = p.relation ? ` (${p.relation})` : '';
                const notes = p.notes ? ` | notes: ${p.notes}` : '';
                const log = Array.isArray(p.log) && p.log.length
                    ? ' | recent: ' + p.log.slice(-3).map(l => `[${new Date(l.ts).toLocaleDateString('en-IN')}] ${l.note}`).join('; ')
                    : '';
                return `${name}${rel}${notes}${log}`;
            }).join('\n');
        }

        function upsertPerson(p) {
            const name = safeStr(p.name).trim();
            if (!name) return;
            if (!userProfile.people || typeof userProfile.people !== 'object') userProfile.people = {};
            const existing = userProfile.people[name] || { relation: '', notes: '', log: [], firstMentioned: Date.now() };
            if (safeStr(p.relation)) existing.relation = safeStr(p.relation).slice(0, 60);
            if (safeStr(p.note)) existing.notes = trimTo((existing.notes ? existing.notes + " | " : "") + safeStr(p.note), 300);
            if (safeStr(p.activity_log)) {
                existing.log = Array.isArray(existing.log) ? existing.log : [];
                existing.log.push({ ts: Date.now(), note: safeStr(p.activity_log).slice(0, 150) });
                if (existing.log.length > 10) existing.log.shift(); // per-person log bhi cap hai
            }
            existing.lastMentioned = Date.now();
            userProfile.people[name] = existing;
            db.ref('buddy/profile/people/' + name.replace(/[.#$\[\]\/]/g, '_')).set(existing);
            logActivity('👤 Person update: ' + name + (p.activity_log ? ' — ' + safeStr(p.activity_log).slice(0, 60) : ''), 'memory');
        }

        function appendTimeline(text, tag) {
            const key = todayKey();
            const entry = { text: safeStr(text).slice(0, 200), tag: safeStr(tag) || 'note', ts: Date.now() };
            db.ref('buddy/timeline/' + key).push(entry);
        }

        // Lightweight embedding: hash-based bag-of-words vector (no extra API call needed — fast + free)
        // Cosine-similarity ke liye kaafi accurate hai chhote memory items ke bich.
        // v3.2: Ab ye sirf FALLBACK hai — normal path embedTextReal() use karta hai (neeche).
        function embedText(text) {
            const v = new Array(128).fill(0);
            const tokens = safeStr(text).toLowerCase().replace(/[^a-z0-9\s\u0900-\u097F]/g, ' ').split(/\s+/).filter(Boolean);
            for (const t of tokens) {
                let h = 0;
                for (let i = 0; i < t.length; i++) h = ((h << 5) - h + t.charCodeAt(i)) | 0;
                v[Math.abs(h) % 128] += 1;
            }
            // normalize
            let mag = 0;
            for (const x of v) mag += x * x;
            mag = Math.sqrt(mag) || 1;
            for (let i = 0; i < v.length; i++) v[i] /= mag;
            return v;
        }
        function cosineSim(a, b) {
            if (!a || !b || a.length !== b.length) return 0;
            let s = 0;
            for (let i = 0; i < a.length; i++) s += a[i] * b[i];
            return s;
        }

        // v3.2: REAL semantic embedding via Gemini's embedContent API. Isse "gaadi" aur "car"
        // jaisa meaning-level match ho sakta hai, jo purana word-hash trick kabhi nahi kar sakta tha.
        // Agar API fail ho jaaye (network/quota), purane local hash-embedding pe silently fallback
        // hota hai — taaki memory-save/search feature kabhi poori tarah break na ho.
        async function embedTextReal(text) {
            const clean = safeStr(text).slice(0, 2000);
            if (!clean) return embedText(clean);
            try {
                const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${EMBEDDING_MODEL}:embedContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'models/' + EMBEDDING_MODEL,
                        content: { parts: [{ text: clean }] },
                        outputDimensionality: EMBED_DIM
                    })
                });
                const data = await r.json();
                const vals = (data && data.embedding && data.embedding.values) ||
                             (data && Array.isArray(data.embeddings) && data.embeddings[0] && data.embeddings[0].values);
                if (Array.isArray(vals) && vals.length === EMBED_DIM) return vals;
                console.warn('Embedding API returned unexpected shape, falling back to local hash embed.', data);
            } catch (e) {
                console.error('Real embedding call failed, falling back to local hash embed:', e);
            }
            return embedText(clean); // fallback — feature kabhi crash nahi karega
        }

        // v3.2: Purane items jo abhi bhi 128-dim wale local-hash embedding se save hue the, unhe
        // gradually real-embedding se upgrade karta hai — EK item per call (taaki koi quota-burst
        // na ho), fire-and-forget. Chalta rehta hai jab tak sab items migrate na ho jaayein.
        let migratingEmbedding = false;
        async function migrateOneOldEmbeddingIfNeeded() {
            if (migratingEmbedding) return;
            const ids = Object.keys(memoryItems);
            for (const id of ids) {
                const it = memoryItems[id];
                if (it && it.text && (!it.embedding || it.embedding.length !== EMBED_DIM)) {
                    migratingEmbedding = true;
                    try {
                        const newVec = await embedTextReal(it.text);
                        if (newVec.length === EMBED_DIM) {
                            it.embedding = newVec;
                            memoryItems[id] = it;
                            db.ref('buddy/memoryItems/' + id + '/embedding').set(newVec);
                            logActivity('🔄 Purani memory item real-embedding se upgrade hui: ' + safeStr(it.text).slice(0, 40), 'memory');
                        }
                    } catch (e) { console.error('Migration failed for', id, e); }
                    migratingEmbedding = false;
                    break; // ek hi item per call
                }
            }
        }


        async function addMemoryItem(text, tag) {
            text = safeStr(text).slice(0, 240);
            if (!text) return;
            // dedupe last 30 items — agar same baat dobara boli gayi, naya item nahi banate,
            // balki PURANE item ka "importance score" badha dete hain. Isse baar-baar mention
            // hui cheez khud-ba-khud zyada "important" ban jaati hai (dekho evictLeastImportantIfOverCap).
            const recentIds = Object.keys(memoryItems).slice(-30);
            for (const rid of recentIds) {
                const it = memoryItems[rid];
                if (it && safeStr(it.text).toLowerCase() === text.toLowerCase()) {
                    it.score = (it.score || 1) + 1;
                    it.ts = Date.now(); // reinforcement pe "fresh" bhi ho jaata hai
                    memoryItems[rid] = it;
                    db.ref('buddy/memoryItems/' + rid).set(it);
                    return;
                }
            }
            const id = 'm_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
            const embedding = await embedTextReal(text); // real semantic embedding (Gemini embedContent)
            const item = { text, tag: safeStr(tag) || 'fact', ts: Date.now(), embedding, score: 1 };
            memoryItems[id] = item;
            db.ref('buddy/memoryItems/' + id).set(item);
            evictLeastImportantIfOverCap();
        }

        // v3.2: Smart eviction — pehle 200-cap hit hone pe hamesha sabse PURANA item hataya jaata
        // tha, chahe wo kitna bhi important ho. Ab har item ka "effective score" nikalte hain
        // (importance score minus age-decay) aur sabse KAM-important wala hatate hain — matlab
        // ek baar-baar reinforce hui purani cheez ek naye one-off mention se zyada der tak tikti hai.
        function evictLeastImportantIfOverCap() {
            const ids = Object.keys(memoryItems);
            const overBy = ids.length - 200;
            if (overBy <= 0) return;
            const now = Date.now();
            const DECAY_PER_DAY = 0.05; // har din thoda importance kam hota hai agar dobara mention na ho
            const ranked = ids.map(id => {
                const it = memoryItems[id];
                const ageDays = (now - (it.ts || now)) / 86400000;
                return { id, effectiveScore: (it.score || 1) - ageDays * DECAY_PER_DAY };
            }).sort((a, b) => a.effectiveScore - b.effectiveScore); // sabse kam-important pehle
            for (let i = 0; i < overBy; i++) {
                const rid = ranked[i].id;
                delete memoryItems[rid];
                db.ref('buddy/memoryItems/' + rid).remove();
            }
        }

        async function buildMemoryContext(userText) {
            const query = (window._pendingMemorySearch || '') + ' ' + safeStr(userText);
            const folder = safeStr(window._pendingMemorySearchFolder || '').toLowerCase();
            window._pendingMemorySearch = '';
            window._pendingMemorySearchFolder = '';

            // Sirf real-embedding (768-dim) wale items hi compare karne layak hain — purane
            // 128-dim local-hash wale items ko yahan skip karte hain (unhe migrateOneOldEmbeddingIfNeeded
            // background me upgrade karta rehta hai, isliye ye dheere-dheere apne aap theek ho jaata hai).
            let items = Object.values(memoryItems).filter(x => x && x.embedding && x.text && x.embedding.length === EMBED_DIM);

            // Folder-aware search: agar AI ne specific folder bola hai (jaise "friends"), pehle
            // usi tag ke andar dhoondo. Agar us folder me kuch na mile, poore pool me fallback karo.
            if (folder) {
                const folderFiltered = items.filter(x => safeStr(x.tag).toLowerCase() === folder);
                if (folderFiltered.length > 0) items = folderFiltered;
            }

            if (items.length === 0) { currentMemoryContext = ''; migrateOneOldEmbeddingIfNeeded(); return; }

            const qv = await embedTextReal(query);
            const scored = items.map(it => ({ text: it.text, tag: it.tag, ts: it.ts, s: cosineSim(qv, it.embedding) }));
            scored.sort((a, b) => b.s - a.s);
            const top = scored.slice(0, 8).filter(x => x.s > 0.05);
            if (top.length === 0) { currentMemoryContext = ''; migrateOneOldEmbeddingIfNeeded(); return; }

            // Retrieval = usefulness ka signal. Jo items actually kaam aaye, unka importance
            // score thoda badha dete hain — isse smart eviction aur bhi behtar kaam karti hai.
            const idsByTextTs = {};
            Object.keys(memoryItems).forEach(id => { const it = memoryItems[id]; idsByTextTs[it.text + '|' + it.ts] = id; });
            top.forEach(t => {
                const rid = idsByTextTs[t.text + '|' + t.ts];
                if (rid && memoryItems[rid]) {
                    memoryItems[rid].score = (memoryItems[rid].score || 1) + 0.3;
                    db.ref('buddy/memoryItems/' + rid + '/score').set(memoryItems[rid].score);
                }
            });

            currentMemoryContext = top.map(x => `• [${x.tag}] ${x.text}`).join('\n');
            migrateOneOldEmbeddingIfNeeded(); // background me ek purana item upgrade karte raho
        }

        function addTimeCapsule(cap) {
            const message = safeStr(cap.message).slice(0, 300);
            const dd = safeStr(cap.deliver_date).trim();
            if (!message || !dd) return;
            let deliverAt = 0;
            const nowTs = Date.now();
            if (/^\+(\d+)d$/i.test(dd)) {
                deliverAt = nowTs + parseInt(dd.match(/\d+/)[0]) * 86400000;
            } else if (/^\+(\d+)h$/i.test(dd)) {
                deliverAt = nowTs + parseInt(dd.match(/\d+/)[0]) * 3600000;
            } else if (/^\+(\d+)m$/i.test(dd)) {
                deliverAt = nowTs + parseInt(dd.match(/\d+/)[0]) * 60000;
            } else if (/^\d{1,2}:\d{2}$/.test(dd)) {
                const [hh, mm] = dd.split(':').map(Number);
                const dl = new Date(); dl.setHours(hh, mm, 0, 0);
                if (dl.getTime() <= nowTs) dl.setDate(dl.getDate() + 1);
                deliverAt = dl.getTime();
            } else {
                const parsed = Date.parse(dd.replace(' ', 'T'));
                if (!isNaN(parsed)) deliverAt = parsed;
            }
            if (!deliverAt || deliverAt <= nowTs) {
                logActivity('⚠️ Time-capsule deliver_date invalid: ' + dd, 'error');
                return;
            }
            const id = 'cap_' + Date.now();
            const entry = { id, message, deliverAt, delivered: false, createdAt: nowTs };
            timeCapsules[id] = entry;
            db.ref('buddy/timeCapsules/' + id).set(entry);
            logActivity('⏳ Time-capsule saved — delivers ' + new Date(deliverAt).toLocaleString('en-IN'), 'task');
        }

        function checkTimeCapsules() {
            const now = Date.now();
            for (const id of Object.keys(timeCapsules)) {
                const c = timeCapsules[id];
                if (!c || c.delivered) continue;
                if (now >= safeNum(c.deliverAt, 0)) {
                    c.delivered = true;
                    db.ref('buddy/timeCapsules/' + id).set(c);
                    enqueueCall(`[SYSTEM TIME-CAPSULE DELIVERY]: Ye message tumne "purane tum" (past user) ne future ke liye chhoda tha: "${c.message}". Surprise + nostalgic tone me deliver karo (1-2 lines), phir chup ho jaana.`, { isSystemOverride: true });
                }
            }
        }

        function checkThrowback() {
            const wk = new Date(Date.now() - 7 * 86400000).toISOString().slice(0, 10);
            const mn = new Date(Date.now() - 30 * 86400000).toISOString().slice(0, 10);
            const picks = [];
            for (const dk of [wk, mn]) {
                const day = timelineByDate[dk];
                if (day) {
                    const arr = Object.values(day);
                    if (arr.length) {
                        const pick = arr[Math.floor(Math.random() * arr.length)];
                        picks.push(`(${dk === wk ? '1 hafte' : '1 mahine'} pehle) ${safeStr(pick.text).slice(0, 100)}`);
                    }
                }
            }
            todaysThrowback = picks.join(' — ');
        }

        function bumpChallengeStreak() {
            const today = todayKey();
            const y = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
            db.ref('buddy/challengeStreakMeta').once('value').then(snap => {
                const meta = snap.val() || {};
                if (meta.lastDoneDate === y || challengeStreak === 0) {
                    challengeStreak = (challengeStreak || 0) + 1;
                } else if (meta.lastDoneDate !== today) {
                    challengeStreak = 1;
                }
                db.ref('buddy/challengeStreak').set(challengeStreak);
                db.ref('buddy/challengeStreakMeta').set({ lastDoneDate: today });

        /* ================= v3: TIC-TAC-TOE MINI-GAME ================= */
        function launchTicTacToe() {
            if (tttActive) return;
            tttActive = true;
            tttGameOver = false;
            gameMode = 'tic_tac_toe';
            tttBoard = Array(9).fill('');
            renderTTT();
            face.style.display = 'none';
            gameOverlay.style.display = 'flex';
            gameStatus.innerText = 'Tumhari baari — koi cell tap karo (Tum ❌)';
            logActivity('🎮 Tic-Tac-Toe launched.', 'system');
        }

        function endGame() {
            tttActive = false;
            tttGameOver = true;
            gameMode = null;
            gameOverlay.style.display = 'none';
            face.style.display = 'flex';
            logActivity('🎮 Game band.', 'system');
        }

        function renderTTT() {
            tttGrid.innerHTML = '';
            for (let i = 0; i < 9; i++) {
                const cell = document.createElement('div');
                cell.className = 'ttt-cell' + (tttBoard[i] ? ' taken' : '');
                cell.innerText = tttBoard[i];
                cell.style.color = tttBoard[i] === 'X' ? '#00e5ff' : '#ff9f4d';
                cell.onclick = () => userTTTMove(i);
                tttGrid.appendChild(cell);
            }
        }

        function tttWinner(b) {
            const L = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            for (const [a,c,d] of L) if (b[a] && b[a] === b[c] && b[a] === b[d]) return b[a];
            if (b.every(x => x)) return 'draw';
            return null;
        }

        function userTTTMove(idx) {
            if (!tttActive || tttGameOver || tttBoard[idx]) return;
            tttBoard[idx] = 'X';
            renderTTT();
            const w = tttWinner(tttBoard);
            if (w) { finishTTT(w); return; }
            gameStatus.innerText = 'Buddy soch raha hai...';
            const boardStr = tttBoard.map((c, i) => c || i).join(' | ');
            enqueueCall(`[TIC-TAC-TOE TURN]: Tum ⭕ ho, user ❌. Board (0-8 index, empty cell number dikha raha hai):\n[${boardStr}]\nApna best move dedo — system_commands.ttt_move me ek empty index (0-8) do. speech_text me ek chhoti chhed-chhaad wali line bolo (1 line). emotion_to_show smirk/curious/laughing types me rakho.`, { isSystemOverride: true });
        }

        function applyBuddyTTTMove(idx) {
            if (!tttActive || tttGameOver) return;
            // AI ne invalid ya taken cell diya toh pehla empty pick karlo
            if (typeof idx !== 'number' || idx < 0 || idx > 8 || tttBoard[idx]) {
                idx = tttBoard.findIndex(c => !c);
                if (idx < 0) return;
            }
            tttBoard[idx] = 'O';
            renderTTT();
            const w = tttWinner(tttBoard);
            if (w) finishTTT(w);
            else gameStatus.innerText = 'Tumhari baari — apna move karo';
        }

        function finishTTT(winner) {
            tttGameOver = true;
            let msg = '';
            if (winner === 'X') { msg = 'Tum jeete! 🎉'; launchConfetti(); }
            else if (winner === 'O') { msg = 'Buddy jeeta 😏'; }
            else msg = 'Draw — tie rahi!';
            gameStatus.innerText = msg + ' (End Game daba ke wapas jao)';
            logActivity('🎮 TTT result: ' + msg, 'system');
        }

        function triggerRoastEnd() {
            const winner = roastScore.user > roastScore.buddy ? 'user' : roastScore.buddy > roastScore.user ? 'buddy' : 'tie';
            gameMode = null;
            logActivity(`🔥 Roast battle end — ${winner === 'tie' ? 'TIE' : winner + ' wins'} (${roastScore.user}-${roastScore.buddy})`, 'system');
            if (winner === 'user' || winner === 'buddy') launchConfetti();
            roastRound = 0;
            roastScore = { user: 0, buddy: 0 };
        }

        /* ================= v3: CONFETTI + EASTER EGG + SECRET GESTURE ================= */
        function launchConfetti() {
            const cont = document.getElementById('confetti-container');
            const colors = ['#00e5ff', '#ff2d78', '#ffd166', '#7fffd4', '#ff9f4d', '#b39dff'];

                const p = document.createElement('div');
                p.className = 'confetti-piece';
                p.style.left = Math.random() * 100 + '%';

                p.style.animationDelay = (Math.random() * 0.5) + 's';

        const SECRET_POOL = ['secret-dizzy', 'secret-rainbow', 'confetti-only', 'love-burst'];
        function runEasterEgg() {
            if (Date.now() - lastSecretAt < 3000) return; // debounce
            lastSecretAt = Date.now();
            const pick = SECRET_POOL[Math.floor(Math.random() * SECRET_POOL.length)];

        // Triple-tap on face — client-side instant, no API call
        function handleFaceTap() {
            const now = Date.now();
            tapTimestamps.push(now);
            tapTimestamps = tapTimestamps.filter(t => now - t < 700);
            if (tapTimestamps.length >= 3) {

        function handleMouthUnlockTap(event) {

        /* ================= 10. DRESS / ROAST TRACKER ================= */
        function logDress(desc) {
            const k = todayKey();
            db.ref('buddy/dressLog').once('value').then(snap => {
                const log = snap.val() || {};
                const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
                const dayBefore = new Date(Date.now() - 2 * 86400000).toISOString().slice(0, 10);
                const similarity = (a, b) => {
                    if (!a || !b) return false;
                    const wa = new Set(a.toLowerCase().split(/\s+/));
                    return b.toLowerCase().split(/\s+/).filter(w => wa.has(w)).length >= 2;
                };
                log[k] = desc;
                db.ref('buddy/dressLog').set(log);
                if (similarity(desc, log[yesterday]) && similarity(desc, log[dayBefore])) {
                    if (commentAllowed('dressRoast', 360, 0.8)) {
                        enqueueCall(`[SYSTEM DRESS ALERT]: User lagatar 3 din se same type ke kapde pehne hai ("${desc}"). Roast karo — "Bhai kapde dho le!" style. Funny raho, mean mat bano.`, { isSystemOverride: true });
                    }
                }
            });
        }

        /* ================= 11. HOURLY SUMMARIZER + ROUTINE BREAKER ================= */
        function hourlyTick() {
            const now = new Date();
            const hr = now.getHours();
            if (hr === lastSummaryHour) return;
            lastSummaryHour = hr;

            // Routine breaker: user normally sleeps early but awake at 3am?
            if (hr >= 1 && hr < 5 && !isSleeping && muteMinutesRemaining === 0) {
                if (commentAllowed('routineBreaker', 180, 0.5)) {
                    enqueueCall(`[SYSTEM NIGHT OBSERVATION]: Raat ke ${hr} baj rahe hain aur user jaga hua hai. Agar iski aadat jaldi sone ki hai toh toko — "Aaj sone ka iraada nahi hai kya?" style. Kabhi kabhi hi bolo.`, { isSystemOverride: true });
                }
            }

            // Hourly summary compress
            if (memHourlySummary.length > 400 && !isApiPaused()) {
                const prompt = `[SYSTEM]: Yeh pichle ghanton ki observation notes hain. Inhe 2-3 lines ki Hinglish summary me compress karo (sirf text):\n${memHourlySummary}`;
                fetch(`https://generativelanguage.googleapis.com/v1beta/models/${LIGHT_MODEL_NAME}:generateContent?key=${API_KEY}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                })
                .then(r => r.json())
                .then(data => {
                    const s = data?.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (s && s.length > 20) {
                        memHourlySummary = s.trim().slice(0, MEM_LIMITS.hourlySummary);
                        db.ref('buddy/memory/hourlySummary').set(memHourlySummary);
                    }
                }).catch(e => console.error(e));
            }
        }

        /* ================= 12. CORE TIMERS ================= */
        // 1-Minute Clock (mute countdown + task checks + hourly tick)
        setInterval(() => {
            if (muteMinutesRemaining > 0) {
                muteMinutesRemaining--;
                if (muteMinutesRemaining === 0) {
                    mouth.classList.remove('muted-visual');
                    updateStatus("Mute khatam — Buddy wapas!");
                }

            checkTasks();
            checkTimeCapsules();
            hourlyTick();
            renderMuteStatus();

        // Daily-tick — throwback check + daily challenge suggestion trigger
        setInterval(() => {
            checkThrowback();
            const today = todayKey();
            const hasChallenge = dailyChallenge && dailyChallenge.date === today;
            const hour = new Date().getHours();
            if (!hasChallenge && hour >= 9 && hour < 22 && lastChallengeRequestDate !== today && muteMinutesRemaining === 0 && !conversationActive) {
                lastChallengeRequestDate = today;
                enqueueCall('[SYSTEM DAILY-CHALLENGE-REQUEST]: Aaj ka koi chhota achievable challenge suggest karo (habits/goals memory se relevant, jaise "30 min bina phone padhai"). system_commands.set_daily_challenge me text daalo. Speech me halka casual tone rakho, ek line.', { isSystemOverride: true });

        // Dynamic Observation Loop (5 min idle / 10 min active chat) — see BACKGROUND_OBSERVATION_ENABLED above
        function startObservationLoop() {
            if (observationTimer) clearInterval(observationTimer);
            if (!BACKGROUND_OBSERVATION_ENABLED) return; // token-saving: periodic photo-checks off
            observationTimer = setInterval(async () => {
                if (isSleeping || muteMinutesRemaining > 0) return;
                if (isSpeaking || isProcessing || conversationActive) return; // don't collide with active work / live conversation
                if (isOffline) return;
                // Deep-night skip — 1AM-6AM bilkul camera off (isSleeping check ke upar bhi as safety)
                const hr = new Date().getHours();
                if (hr >= 1 && hr < 6) return;

                // --- Buddy's own mood ticks up quietly the longer it's quiet (esp. during study) ---
                const idleMinutes = (Date.now() - lastRealInteractionAt) / 60000;
                if (lastDetectedActivity === 'studying') {
                    buddyMood = Math.min(100, buddyMood + 4 + Math.random() * 4);
                } else if (idleMinutes > 5) {
                    buddyMood = Math.min(100, buddyMood + 1 + Math.random() * 2);
                }
                saveAiState();

                // --- 1) REAL boredom trigger — code-controlled, not just LLM's mood ---
                // Genuine silence (no actual user interaction) crosses a real threshold,
                // so Buddy self-initiates instead of relying on the model to "feel" bored.
                if (idleMinutes >= BORED_THRESHOLD_MIN && commentAllowed('boredomGame', 20, 0.6)) {
                    setExpression('bored');
                    const photo = await takeSnapshot();
                    enqueueCall(`[SYSTEM BOREDOM]: User se ${Math.floor(idleMinutes)} minute se koi real baat-cheet nahi hui. Tum genuinely bore ho gaye ho. Emotion_to_show "bored" rakho aur ya toh user ko ek chhota game offer karo (word-chain/antakshari/paheli), YA agar photo me user dikh hi nahi raha toh self_decision.want_to_do:"play" bhejo (khud akele khelo). In dono me se koi ek zaroor karo — chup mat raho.`, { base64Image: photo, isSystemOverride: true });
                    return;
                }

                // --- 2) Study-mode restraint — driven by Buddy's OWN mood, not a fixed dice roll ---
                // Jitni der se studying dekh raha hai utna restless hota jaata hai (buddyMood upar),
                // aur jab mood kaafi badh jaaye tabhi kabhi-kabhi khud check-in karta hai — warna chup.
                if (lastDetectedActivity === 'studying') {
                    const cooldownOk = (Date.now() - (lastCommentAt['studyCheckIn'] || 0)) > 30 * 60000;
                    const chance = Math.min(0.55, buddyMood / 160); // zyada restless = thoda zyada chance, kabhi guarantee nahi
                    if (!cooldownOk || Math.random() > chance) {
                        const photo = await takeSnapshot();
                        if (photo) enqueueCall("[SYSTEM SILENT OBSERVE - STUDY MODE]: User padhai kar raha hai — bilkul disturb mat karo. Image sirf memory/habit note ke liye dekho, action silent hi rakhna.", { base64Image: photo, background: true });
                        return;
                    }
                    // Mood ne is baar "bolo" bola — bolne ke baad restlessness thodi shant ho jaati hai
                    lastCommentAt['studyCheckIn'] = Date.now();
                    const moodAtTrigger = Math.round(buddyMood);
                    buddyMood = Math.max(10, buddyMood - 35);
                    saveAiState();
                    setExpression('curious');
                    const photo = await takeSnapshot();
                    enqueueCall(`[SYSTEM STUDY CHECK-IN]: Tumhara abhi ka restlessness/curiosity level ${moodAtTrigger}/100 tak pahuch gaya tha, isliye is baar halka sa bolne ka mann kiya. User padhai kar raha hai — EXTRA halka comment/sawal karo (jaise "Kya padh rahe ho?" ya posture tip), 1 line se zyada mat bolo, phir chup ho jaana.`, { base64Image: photo, isSystemOverride: true });
                    return;
                }

                if (!commentAllowed('observationSpeak', 25, 0.45)) {
                    // still silently log habit/activity occasionally without speaking
                    const photo = await takeSnapshot();
                    if (photo) enqueueCall("[SYSTEM SILENT OBSERVE]: Image dekho. Kuch bolna nahi hai (action silent rakhna almost zaroori) — sirf agar koi important habit/activity dikhe toh memory me note karo. Jab user wapas aaye toh ye notes kaam aayengi.", { base64Image: photo, background: true });
                    return;
                }
                const photo = await takeSnapshot();
                enqueueCall("[SYSTEM]: Background Observation. Image dekho. Normal sab theek ho toh silent raho. Sirf genuinely interesting/nayi cheez pe comment karo — checklist follow karo par anti-spam discipline yaad rakhna.", { base64Image: photo, background: true });
            }, observationIntervalTime);
        }

        // 15-Minute Auto-Wake Cycle (AI khud decide karega kya karna hai)
        setInterval(async () => {
            if (isSleeping && muteMinutesRemaining === 0) {
                setExpression('normal');
                const photo = await takeSnapshot();

        // --- Randomized self-play reactions when bored/alone ---
        // Multiple variants so it doesn't feel scripted; remembers the last one used

        const BORED_VARIANTS = ['play_happy_sleep', 'curious_chase', 'confused_laugh', 'mischief_wink', 'just_sleepy',

        function handleSelfDecision(selfDec, sysCmds) {
