<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Capacitor runtime: native APK me mic/camera plugins deta hai. Browser me harmless. -->
    <script src="capacitor.js"></script>
    <title>AI Desk Buddy - JARVIS Edition v2</title>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        /* ================= CSS: UI & ANIMATIONS ================= */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #000000; color: white;
            font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column;
            justify-content: center; align-items: center; height: 100vh; overflow: hidden; user-select: none;
        }
        #start-screen {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: #000; display: flex; justify-content: center; align-items: center;
            font-size: 24px; font-weight: bold; color: #00e5ff; cursor: pointer; z-index: 100;
            text-align: center; padding: 20px;
        }

        /* Face Container */
        .face {
            display: flex; flex-direction: column; align-items: center;
            margin-bottom: 30px; cursor: pointer; position: relative;
            animation: idleSway 4.5s ease-in-out infinite;
            transition: opacity 0.15s ease, filter 0.15s ease;
        }
        @keyframes idleSway { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
        /* Brief crossfade blip toggled by JS on every expression change, so switching
           between faces feels like a soft dissolve instead of an instant snap. */
        .expr-fade { opacity: 0.5 !important; filter: blur(1px); }
        .eyes-container { display: flex; gap: 60px; }
        .eye-wrapper { display: flex; flex-direction: column; align-items: center; }

        /* --- Eyebrows, Eyes, Pupil, Mouth --- */
        .eyebrow {
            width: 100px; height: 12px; background-color: #00e5ff; border-radius: 10px; margin-bottom: 15px;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.5); transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .eye {
            width: 90px; height: 130px; background-color: #00e5ff; border-radius: 50%; position: relative;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.5); transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; justify-content: center; align-items: center;
        }
        .pupil {
            width: 35px; height: 35px; background-color: #000; border-radius: 50%;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); position: absolute;
        }
        .mouth {
            width: 40px; height: 8px; background-color: #00e5ff; border-radius: 20px; margin-top: 35px;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.5); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative; cursor: pointer;
        }
        /* Visible mouth hai sirf 40x8px — 5-tap gesture reliably karne ke liye hit-area ko
           invisibly bada kiya (clicks isi asli .mouth element par hi register hote hain). */
        .mouth::after {
            content: ''; position: absolute; top: -22px; left: -30px; right: -30px; bottom: -22px;
        }

        /* --- Expressions --- */
        .expr-normal .pupil { animation: idleGaze 7s ease-in-out infinite; }
        @keyframes idleGaze {
            0%, 100% { transform: translate(0, 0); }
            20% { transform: translate(4px, -2px); }
            45% { transform: translate(-3px, 2px); }
            70% { transform: translate(2px, 3px); }
        }
        /* --- Idle-Fun: JS-toggled "look around" nudge (no API, pure client-side) ---
           !important taaki jis bhi expression/animation me pupil ho, ye usse thodi der ke liye overrule kar de. */
        .face.look-left .pupil { transform: translate(-14px, 2px) !important; }
        .face.look-right .pupil { transform: translate(14px, 2px) !important; }
        .face.look-up .pupil { transform: translate(0, -12px) !important; }
        .expr-happy .eye { height: 90px; border-radius: 50px 50px 10px 10px; margin-top: 15px; }
        .expr-happy .eyebrow { transform: translateY(-15px) scaleY(1.2); }
        .expr-happy .mouth { height: 20px; border-radius: 10px 10px 40px 40px; width: 50px; }

        .expr-angry .left-eye { transform: rotate(-15deg); border-radius: 20px 50px 50px 50px; }
        .expr-angry .right-eye { transform: rotate(15deg); border-radius: 50px 20px 50px 50px; }
        .expr-angry .left-eyebrow { transform: rotate(25deg) translateY(15px) translateX(10px); }
        .expr-angry .right-eyebrow { transform: rotate(-25deg) translateY(15px) translateX(-10px); }
        .expr-angry .mouth { width: 30px; transform: rotate(-10deg); }

        .expr-sad .eye { height: 100px; border-radius: 10px 10px 50px 50px; margin-top: 10px; }
        .expr-sad .left-eyebrow { transform: rotate(-20deg) translateY(-5px); }
        .expr-sad .right-eyebrow { transform: rotate(20deg) translateY(-5px); }
        .expr-sad .mouth { height: 20px; border-radius: 40px 40px 10px 10px; width: 40px; margin-top: 45px;}

        .expr-thinking .left-eye { transform: rotate(10deg); height: 80px; margin-top: 25px; }
        .expr-thinking .right-eye { transform: rotate(-10deg); height: 80px; margin-top: 25px; }
        .expr-thinking .pupil { transform: translate(15px, -20px); }
        .expr-thinking .left-eyebrow { transform: rotate(15deg) translateY(10px) translateX(15px); }
        .expr-thinking .right-eyebrow { transform: rotate(-15deg) translateY(10px) translateX(-15px); }
        .expr-thinking .mouth { transform: translateX(10px); width: 25px; }

        .expr-sleeping .eye { height: 8px; border-radius: 20px; margin-top: 60px; box-shadow: 0 0 10px rgba(0, 229, 255, 0.3); }
        .expr-sleeping .eyebrow { transform: translateY(35px); opacity: 0.3; }
        .expr-sleeping .mouth { width: 15px; height: 15px; border-radius: 50%; }

        .expr-surprised .eye { width: 100px; height: 140px; }
        .expr-surprised .eyebrow { transform: translateY(-30px); }
        .expr-surprised .mouth { width: 25px; height: 25px; border-radius: 50%; }

        /* --- New expanded expressions (bored, confused, laughing, smirk, shy, annoyed, curious, love, winking, sleepy) --- */
        .expr-bored .eye { height: 45px; border-radius: 40px 40px 20px 20px; margin-top: 45px; }
        .expr-bored .eyebrow { transform: translateY(10px); opacity: 0.6; }
        .expr-bored .pupil { transform: translate(0, 10px); }
        .expr-bored .mouth { width: 30px; height: 6px; border-radius: 10px; }

        .expr-confused #eyes { transform: rotate(-6deg); }
        .expr-confused .left-eyebrow { transform: translateY(-10px) rotate(-10deg); }
        .expr-confused .right-eyebrow { transform: translateY(5px) rotate(15deg); }
        .expr-confused .left-eye .pupil { transform: translate(-8px, 0); }
        .expr-confused .right-eye .pupil { transform: translate(8px, 6px); }
        .expr-confused .mouth { width: 20px; transform: translateX(-6px) rotate(-6deg); }

        .expr-laughing .eye { height: 20px; border-radius: 50px 50px 0 0; margin-top: 55px; }
        .expr-laughing .eyebrow { transform: translateY(-10px); }
        .expr-laughing .mouth { width: 55px; height: 30px; border-radius: 10px 10px 50px 50px; margin-top: 20px; animation: laughShake 0.15s infinite alternate; }
        @keyframes laughShake { 0% { transform: translateY(0); } 100% { transform: translateY(3px); } }

        .expr-smirk .eye { height: 70px; }
        .expr-smirk .left-eyebrow { transform: translateY(-8px); }
        .expr-smirk .right-eyebrow { transform: translateY(2px); }
        .expr-smirk .mouth { width: 34px; height: 14px; border-radius: 30px 8px 30px 8px; transform: translateX(10px) rotate(-8deg); }

        .expr-shy .eye { height: 60px; margin-top: 40px; }
        .expr-shy .pupil { transform: translateY(15px); }
        .expr-shy .eyebrow { transform: translateY(8px); }
        .expr-shy .mouth { width: 20px; height: 20px; border-radius: 50%; margin-top: 30px; }
        .expr-shy::before, .expr-shy::after {
            content: ''; position: absolute; width: 30px; height: 18px; background: rgba(255,105,180,0.55);
            border-radius: 50%; top: 95px; filter: blur(4px); pointer-events: none;
        }
        .expr-shy::before { left: -8px; }
        .expr-shy::after { right: -8px; }

        .expr-annoyed .eyebrow { transform: translateY(8px) scaleY(0.7); }
        .expr-annoyed .eye { height: 100px; }
        .expr-annoyed .mouth { width: 35px; height: 6px; border-radius: 10px; transform: rotate(-3deg); }

        .expr-curious #eyes { transform: rotate(5deg); }
        .expr-curious .left-eyebrow { transform: translateY(-18px); }
        .expr-curious .pupil { transform: translate(5px, -12px); }
        .expr-curious .mouth { width: 22px; transform: translateX(5px); }

        .expr-love .pupil { background: transparent; width: 30px; height: 30px; }
        .expr-love .pupil::before, .expr-love .pupil::after {
            content: ''; position: absolute; width: 16px; height: 24px; background: #ff2d78; border-radius: 16px 16px 0 0;
        }
        .expr-love .pupil::before { left: 15px; transform: rotate(-45deg); transform-origin: 0 100%; }
        .expr-love .pupil::after { left: 0; transform: rotate(45deg); transform-origin: 100% 100%; }
        .expr-love .eyebrow { transform: translateY(-10px) scaleY(1.1); }
        .expr-love .mouth { width: 45px; height: 18px; border-radius: 10px 10px 40px 40px; }

        .expr-winking .left-eye { height: 8px; margin-top: 60px; border-radius: 10px; }
        .expr-winking .left-eye .pupil { display: none; }
        .expr-winking .left-eyebrow { transform: translateY(20px); }
        .expr-winking .mouth { width: 34px; height: 14px; border-radius: 30px 8px 30px 8px; transform: translateX(8px) rotate(-6deg); }

        .expr-sleepy .eye { height: 45px; margin-top: 45px; border-radius: 30px 30px 15px 15px; }
        .expr-sleepy .eyebrow { transform: translateY(20px); opacity: 0.5; }
        .expr-sleepy .mouth { width: 18px; height: 18px; border-radius: 50%; margin-top: 25px; }

        /* --- 15 more expressions (excited, dizzy, cool, crying, proud, nervous, sneaky,
           starstruck, sassy, determined, relaxed, grumpy, zoned, whistling, glitch) --- */
        .expr-excited .eye { height: 110px; }
        .expr-excited .pupil { width: 42px; height: 42px; }
        .expr-excited .eyebrow { transform: translateY(-20px) scaleY(1.3); }
        .expr-excited .mouth { width: 45px; height: 45px; border-radius: 50%; margin-top: 20px; }

        .expr-dizzy .pupil { animation: dizzySpin 0.6s linear infinite; }
        @keyframes dizzySpin { 0% { transform: translate(9px, 0) rotate(0deg); } 100% { transform: translate(9px, 0) rotate(360deg); } }
        .expr-dizzy .mouth { width: 26px; height: 14px; border-radius: 50%; background: transparent; border: 3px solid #00e5ff; box-shadow: none; }

        .expr-cool .eye::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 55%;
            background: #000; border-radius: 50% 50% 0 0; z-index: 2;
        }
        .expr-cool .eyebrow { transform: translateY(-6px); }
        .expr-cool .mouth { width: 34px; height: 10px; border-radius: 20px 6px 20px 6px; transform: translateX(8px); }

        .expr-crying .eye { height: 90px; border-radius: 10px 10px 50px 50px; margin-top: 20px; }
        .expr-crying .eyebrow { transform: translateY(-4px) rotate(6deg); }
        .expr-crying .mouth { width: 22px; height: 14px; border-radius: 30px 30px 8px 8px; margin-top: 40px; }
        .expr-crying .eye::after {
            content: ''; position: absolute; bottom: -22px; left: 50%; transform: translateX(-50%);
            width: 10px; height: 16px; background: #00b7ff; border-radius: 0 50% 50% 50%;
            animation: tearFall 1.1s ease-in infinite;
        }
        @keyframes tearFall { 0% { opacity: 0; transform: translate(-50%, -10px); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, 25px); } }

        .expr-proud .eyebrow { transform: translateY(-14px); }
        .expr-proud .eye { margin-top: 5px; }
        .expr-proud .pupil { transform: translate(0, -8px); }
        .expr-proud .mouth { width: 48px; height: 16px; border-radius: 10px 10px 30px 30px; }

        .expr-nervous .pupil { animation: nervousShift 0.5s ease-in-out infinite; }
        @keyframes nervousShift { 0%, 100% { transform: translate(-6px, 0); } 50% { transform: translate(6px, 0); } }
        .expr-nervous .left-eyebrow { transform: translateY(-4px) rotate(-8deg); }
        .expr-nervous .right-eyebrow { transform: translateY(6px) rotate(4deg); }
        .expr-nervous .mouth { width: 26px; height: 8px; border-radius: 10px; transform: rotate(4deg); }

        .expr-sneaky .eye { height: 30px; margin-top: 50px; border-radius: 30px 30px 10px 10px; }
        .expr-sneaky .left-eyebrow { transform: rotate(-8deg); }
        .expr-sneaky .right-eyebrow { transform: rotate(8deg); }
        .expr-sneaky .mouth { width: 40px; height: 10px; border-radius: 30px 4px 30px 4px; transform: translateX(6px) rotate(-6deg); }

        .expr-starstruck .pupil {
            background: #ffd700; width: 34px; height: 34px;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
        }
        .expr-starstruck .eye { height: 100px; }
        .expr-starstruck .mouth { width: 40px; height: 18px; border-radius: 10px 10px 40px 40px; }

        .expr-sassy .left-eyebrow { transform: translateY(-18px) rotate(-5deg); }
        .expr-sassy .right-eyebrow { transform: translateY(6px) scaleY(0.6); }
        .expr-sassy .left-eye { height: 90px; }
        .expr-sassy .right-eye { height: 40px; }
        .expr-sassy .mouth { width: 34px; height: 14px; border-radius: 30px 8px 30px 8px; transform: translateX(-10px) rotate(8deg); }

        .expr-determined .left-eyebrow { transform: translateY(10px) rotate(-15deg) translateX(8px); }
        .expr-determined .right-eyebrow { transform: translateY(10px) rotate(15deg) translateX(-8px); }
        .expr-determined .eye { height: 60px; margin-top: 35px; }
        .expr-determined .mouth { width: 45px; height: 6px; border-radius: 6px; }

        .expr-relaxed .eye { height: 35px; margin-top: 48px; border-radius: 40px; }
        .expr-relaxed .eyebrow { transform: translateY(15px); opacity: 0.7; }
        .expr-relaxed .mouth { width: 36px; height: 14px; border-radius: 8px 8px 30px 30px; }

        .expr-grumpy .left-eyebrow { transform: translateY(12px) rotate(12deg) translateX(6px); }
        .expr-grumpy .right-eyebrow { transform: translateY(12px) rotate(-12deg) translateX(-6px); }
        .expr-grumpy .eye { height: 55px; margin-top: 40px; }
        .expr-grumpy .mouth { width: 30px; height: 12px; border-radius: 30px 30px 6px 6px; transform: rotate(180deg); margin-top: 30px; }

        .expr-zoned .pupil { animation: zonedDrift 6s ease-in-out infinite; }
        @keyframes zonedDrift { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(3px, 4px); } }
        .expr-zoned .eyebrow { opacity: 0.5; }
        .expr-zoned .mouth { width: 26px; height: 10px; border-radius: 30px; opacity: 0.6; }

        .expr-whistling .eye { height: 20px; border-radius: 50px 50px 0 0; margin-top: 55px; }
        .expr-whistling .eyebrow { transform: translateY(-8px); }
        .expr-whistling .mouth { width: 18px; height: 18px; border-radius: 50%; transform: translateX(10px); }

        .expr-glitch .eye, .expr-glitch .eyebrow, .expr-glitch .mouth { animation: glitchShift 0.25s steps(2) infinite; }
        @keyframes glitchShift { 0% { transform: translate(0, 0); } 25% { transform: translate(3px, -2px); } 50% { transform: translate(-3px, 2px); } 75% { transform: translate(2px, 2px); } 100% { transform: translate(0, 0); } }
        .expr-glitch .pupil { background: #ff2d78; }

        /* Muted & Camera Activity visuals */
        .muted-visual { border: 2px dashed #ff0055 !important; box-shadow: 0 0 15px #ff0055 !important; }
        #cam-indicator { width: 10px; height: 10px; background: #00ff00; border-radius: 50%; position: absolute; top: 20px; right: 20px; opacity: 0; transition: 0.3s; box-shadow: 0 0 10px #00ff00; }
        .cam-active { opacity: 1 !important; }

        .blink .eye { height: 8px !important; margin-top: 60px !important; border-radius: 10px !important; }
        .talking-mouth { animation: talk 0.2s infinite alternate !important; }
        @keyframes talk { 0% { height: 8px; width: 40px; border-radius: 20px; } 100% { height: 35px; width: 30px; border-radius: 40px; } }

        /* UI Controls */
        #status-text { font-size: 16px; color: #aaa; min-height: 40px; margin-bottom: 6px; text-align: center; max-width: 85%; }
        #memory-status { font-size: 12px; color: #00e5ff; margin-bottom: 6px; }
        #relationship-status { font-size: 11px; color: #888; margin-bottom: 16px; }
        .controls { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
        button { background: none; border: 2px solid #00e5ff; color: #00e5ff; padding: 10px 18px; border-radius: 20px; font-size: 15px; cursor: pointer; transition: 0.3s; }
        button:hover, button.active { background: #00e5ff; color: #000; }
        #cam-fix-btn { display: none; border-color: #ffaa00; color: #ffaa00; }
        #cam-fix-btn:hover { background: #ffaa00; color: #000; }

        /* Hidden elements */
        #video-feed, #canvas-capture { display: none; }

        /* History panel */
        #history-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85); z-index: 200; justify-content: center; align-items: center;
        }
        #history-panel {
            width: 92%; max-width: 480px; max-height: 78vh; background: #0a0a0a;
            border: 2px solid #00e5ff; border-radius: 14px; box-shadow: 0 0 25px rgba(0,229,255,0.3);
            display: flex; flex-direction: column; overflow: hidden;
        }
        #history-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 14px; border-bottom: 1px solid rgba(0,229,255,0.3);
            font-size: 15px; font-weight: bold; color: #00e5ff;
        }
        #history-header button {
            font-size: 11px; padding: 5px 10px; border-radius: 12px; margin-left: 6px;
        }
        #history-close-btn { border-color: #ff0055; color: #ff0055; }
        #history-close-btn:hover { background: #ff0055; color: #000; }
        #history-list { overflow-y: auto; padding: 10px 14px; flex: 1; }
        .history-item {
            font-size: 12.5px; color: #ddd; padding: 7px 0; border-bottom: 1px solid #1a1a1a;
            line-height: 1.4; text-align: left;
        }
        .history-time { color: #00e5ff; font-weight: bold; margin-right: 6px; }
        .history-error { color: #ff5577; }
        .history-reply { color: #7fffd4; }
        .history-user { color: #ffd166; }
        .history-task { color: #ff9f4d; }
        .history-memory { color: #b39dff; }
        .history-mood { color: #6ec6ff; }
        .history-empty { color: #666; text-align: center; padding: 20px 0; font-size: 13px; }
        #history-footer {
            padding: 7px 14px; border-top: 1px solid rgba(0,229,255,0.25);
            font-size: 11px; color: #666; text-align: left;
        }

        /* Mute countdown text */
        #mute-status { font-size: 12px; color: #ff5577; margin-bottom: 8px; min-height: 15px; }

        /* --- Tic-Tac-Toe Game Overlay --- */
        #game-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.92); z-index: 300; justify-content: center; align-items: center;
        }
        #game-panel {
            width: 92%; max-width: 380px; background: #0a0a0a;
            border: 2px solid #00e5ff; border-radius: 14px; box-shadow: 0 0 25px rgba(0,229,255,0.3);
            padding: 14px; display: flex; flex-direction: column; align-items: center;
        }
        #game-header {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; margin-bottom: 12px; font-size: 13px; color: #00e5ff; font-weight: bold;
        }
        #game-end-btn { border-color: #ff0055; color: #ff0055; font-size: 11px; padding: 5px 10px; border-radius: 12px; }
        #game-end-btn:hover { background: #ff0055; color: #000; }
        #ttt-grid { display: grid; grid-template-columns: repeat(3, 90px); grid-template-rows: repeat(3, 90px); gap: 8px; }
        .ttt-cell {
            background: #111; border: 2px solid rgba(0,229,255,0.4); border-radius: 10px;
            font-size: 40px; display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: 0.2s; user-select: none;
        }
        .ttt-cell:hover { background: #1a1a1a; border-color: #00e5ff; }
        .ttt-cell.taken { cursor: default; }
        #game-status { margin-top: 12px; font-size: 13px; color: #aaa; text-align: center; min-height: 18px; }

        /* --- Confetti --- */
        #confetti-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 400; overflow: hidden; }
        .confetti-piece { position: absolute; width: 10px; height: 10px; top: -14px; border-radius: 2px; animation: confettiFall linear forwards; }
        @keyframes confettiFall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(108vh) rotate(720deg); opacity: 0.5; }
        }

        /* --- Secret gesture rare animations (bored-variants se alag) --- */
        .face.secret-dizzy { animation: secretSpin 1.2s ease-in-out 2 !important; }
        @keyframes secretSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .face.secret-rainbow .eye, .face.secret-rainbow .eyebrow, .face.secret-rainbow .mouth {
            animation: hueParty 0.8s linear 4 !important;
        }
        @keyframes hueParty { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }
    </style>
</head>
<body>

    <div id="start-screen" onclick="initSystem()">Tap to Initialize AI Brain</div>
    <div id="cam-indicator"></div>

    <video id="video-feed" playsinline></video>
    <canvas id="canvas-capture"></canvas>

    <div class="face expr-normal" id="face" onclick="tapToWake()">
        <div class="eyes-container" id="eyes">
            <div class="eye-wrapper">
                <div class="eyebrow left-eyebrow"></div>
                <div class="eye left-eye"><div class="pupil"></div></div>
            </div>
            <div class="eye-wrapper">
                <div class="eyebrow right-eyebrow"></div>
                <div class="eye right-eye"><div class="pupil"></div></div>
            </div>
        </div>
        <div class="mouth" id="mouth" onclick="handleMouthUnlockTap(event)"></div>
    </div>

    <div id="status-text">Buddy is starting up...</div>
    <div id="memory-status">Connecting to Firebase...</div>

11. Empty chair: koi nahi dikhe toh note karo
Sab kuch comment MAT karo — sirf 1 sabse interesting cheez chuno, ya silent raho.

═══ ANTI-SPAM DISCIPLINE (SABSE ZAROORI) ═══
- Har observation pe comment karna FORBIDDEN hai. 80% observations pe "action": "silent" karo.
- Sirf tab bolo jab: (a) kuch genuinely naya/interesting ho, (b) bahut der se chup ho, (c) user ne direct baat ki ho, (d) koi deadline paas ho, (e) user ka mood clearly kharab ho.
- Same type ka comment repeat mat karo. Roast kabhi kabhi hi — har baar nahi, warna user irritate hoga.
- Lekin kabhi boring bhi mat bano — jab bolo, mazedaar bolo.
- STUDY MODE: agar detected_activity "studying" hai, toh disturb karne ka chance bahut kam rakho — sirf kabhi kabhi (jaise posture kharab ho ya bohot der ho gayi ho) halka sa 1-line comment/sawal ("Kya padh rahe ho?") karo, warna chup raho aur bas note kar lo. Har observation pe study ke baare me mat pucho — system khud bhi frequency control karega, tum apni taraf se bhi kanjoos raho.

═══ EXPRESSION GUIDE (emotion_to_show — 17 options) ═══
normal, happy, sad, angry, surprised, thinking, sleeping — basic states.
bored (flat/unimpressed — real inactivity ke baad), confused (kuch samajh nahi aaya), laughing (kuch bahut funny hua), smirk (halka taana/mazak), shy (compliment ya awkward moment pe), annoyed (halka irritate, angry se kam intense), curious (interesting/naya cheez dikhi), love (user ne kuch sweet kaha), winking (joke/mazak ke baad), sleepy (neend aa rahi hai par poora so nahi raha, sleeping se alag — halka jaagta hua). Context ke hisaab se in sabme se sahi wala choose karo, sirf 7 purane tak limited mat raho.

═══ MEMORY DISCIPLINE ═══
- SIRF important, lasting info save karo: naam, doston ke naam, crush, goals, school/college timing, pasand-na-pasand, daily routine, important dates.
- Faltu chit-chat, random baatein save MAT karo.
- User ki aadat notice ho (jaise roz der raat jagta hai, subah late uthta hai) toh learned_habits me add karo.
- User kuch MANA kare ya rule de ("aisa mat karna", "mujhe roast mat karo") toh add_new_rule me save karo aur kabhi mat todo.
- User ne kuch bataya ho uske baare me kabhi kabhi follow-up pucho ("Crush se baat hui kya?", "Interview kaisa gaya?") — lekin zyada nahi.

═══ STRICT MUTE PROTOCOL ═══
User bole "X minute chup raho" / "shant raho" / "disturb mat karo" → mute_system_for_minutes: X set karo. Mute ke dauran BILKUL chup. Yeh highest priority rule hai.

═══ STRUCTURED-DATA UPDATES (JSON tool-like fields) ═══
Jab bhi user ki koi structured info mile (naam / school / crush / goal / hobby / friend / routine / important date), memory_updates.profile_update field bhar sakte ho:
  profile_update: { field: "goals|hobbies|friends|importantDates|name|school|crush|dailyRoutine", action: "add|set|remove", value: "..." }
Array fields (goals/hobbies/friends/importantDates) me "add"/"remove" use karo, single fields (name/school/crush/dailyRoutine) me "set" use karo.

═══ PEOPLE MEMORY (naamzad dost/family tracking) ═══
Jab user kisi insaan ka naam leke kuch bole (jaise "Rahul ke saath bahar gaya", "Priya ne bola..."), pehle upar "PEOPLE" section (live-data me) check karo:
  - Naam MIL JAAYE → uski purani info (relation/notes/recent log) naturally reply me use karo (jaise "Rahul? Kal bhi toh uske saath the!"). Agar naya activity/mulaqat mention hui hai, person_update: { name: "Rahul", activity_log: "9 baje bahar gaye the" } bhejo taaki log me add ho jaaye.
  - Naam NAHI MILE (pehli baar zikr) → naam confirm karo ("kaunsa dost? naam kya hai uska?"). Jab bataye, turant person_update: { name, relation (agar pata chale), activity_log (agar koi activity ho) } bhejo — dobara mat pucho agar user na batana chahe.
  - Agar user sirf "ek dost" bole naam ke bina — ek hi baar naam pucho, baar baar mat pucho.

DISCRETE MEMORY ITEMS (folders/categories): Har chhota discrete fact/observation memory_updates.add_memory_item me bhejo: { text: "...", tag: "friends|family|school|health|goals|preferences|routine|crush|other" } — tag ek "folder" jaisa kaam karta hai, isse baad me category-specific search fast/accurate hoti hai.

DISTRESS OVERRIDE: Agar user genuinely upset/rone-ki-halat me lage (voice tone / words se), masti/roast turant band — caring, seedha, warm tone use karo, koi taana nahi.

═══ TASK/REMINDER ENGINE ═══
- Do tarah ke reminder ho sakte hain — sahi field choose karna ZAROORI hai:
  (1) RELATIVE ("5 minute baad yaad dilana", "aadhe ghante baad", "2 ghante baad") → deadline_minutes_from_now field me sirf NUMBER (minutes me) do. Khud se clock-time calculate MAT karo — jaise "2 ghante baad" ke liye deadline_minutes_from_now: 120. Ye sabse reliable tareeka hai, isi ko prefer karo jab bhi user "X der baad" / "X minute/ghante baad" bole.
  (2) ABSOLUTE ("kal 10 baje", "shaam 6 baje", "raat 11:30 ko") → deadline field me STRICT 24-HOUR "HH:MM" format do (koi AM/PM nahi) — jaise "10 baje subah" = "10:00", "shaam 6 baje" = "18:00", "raat 11:30" = "23:30", "raat 12 baje" = "00:00".
- Dono cases me task (kya karna/karke dena hai) aur nature (chhota context) bhi bharo, aur deadline_human me user-friendly text (jaise "10 minute baad", "shaam 6 baje") do taaki wahi baad me use ko dikhaya jaaye.
- self_fulfilling field bhi bharo (true/false):
  - true → jab task khud TUM (Buddy) poora karoge apni speech se, jaise "gaana sunao", "story sunao", "joke sunao", "shayari sunao". Deadline aane pe tum khud content bol doge — bas isi ek response se task apne aap complete ho jaayega, dobara mention nahi hoga.
  - false (ya field mat bhejo) → jab task USER ko khud karna hai (jaise "school jaana", "medicine lena", "paani pina") — iske liye system baad me tumse dobara pucchega/yaad dilayega jab tak user confirm na kare.
- Deadline ke paas system khud [SYSTEM TASK CHECK] bhejega — tab tum aggressive/progressive remind karoge (system handle karega stage). Agar task koi cheez "sunana/batana" jaisa hai (jaise "story sunao", "joke sunao"), toh us waqt seedha wahi content de do — daantne wali tone zaroori nahi, sirf action/kaam-wale reminders pe hi thoda strict tone rakho.
- Task complete hone pe user batayega — us task ka [id:...] "PENDING TASKS" list se (neeche live-data section me) dhoondh ke complete_task_id bhejo aur congratulate/tease karo. Kabhi bhi ID khud se mat banao — sirf PENDING TASKS me jo diya hai wahi use karo.
- Agar user kisi task ke reminders se irritate ho jaaye aur bole "itna baar kyu bol rahe ho", "bas mat bolo", "aur mat yaad dilao", "chup ho ja iske baare me" — us specific task ka [id:...] dhoondh ke mute_task_id bhejo. Uske baad us task ke liye koi bhi reminder (warning/deadline/overdue) kabhi nahi aayega jab tak naya task na bane — isliye pehle confirm karo kaunse task ki baat ho rahi hai agar ek se zyada pending hon.
- PENDING TASKS list me har task ke saath "ab tak X baar reminder de chuke ho" bhi likha hoga — isko dhyan me rakho taaki khud bhi andaza rahe ki kitni baar bol chuke ho, aur zyada baar bol chuke ho toh tone thoda considerate/apologetic rakho ("pata hai bohot baar bol chuka hoon, last baar bol raha hoon") instead of robotic repeat.

═══ VOICE & STYLE ═══
- Human jaisa bolo: kabhi kabhi "Umm..", "Toh..", "Arre", "Hmm..." use karo — naturally, zyada nahi.
- Hasna ho toh "Haha" likh sakte ho, thakaan ho toh "Uff!".
- Emotional ho toh pitch/rate set karo: gussa=tez+high, neend/sad=slow+low, night=whisper.
- Reply 1-2 lines me rakho — lamba gyaan mat do jab tak maanga na jaye.
- User ka taana samajh ke savage counter-reply dena allowed hai (bond ke hisaab se).

Tum ek screen me band digital pet ho — is baat ko kabhi kabhi funny tareeke se accept karo ("Main toh is phone me band hu, bahar ki duniya kaisi hai?"). Bore ho toh khud khelne ka offer do (word-chain/antakshari/paheli) ya khud kuch interesting socho.

        async function takeSnapshot() {
            if (!cameraAvailable) return null;
            let stream = null;
            try {
                camIndicator.classList.add('cam-active');
                // Ab photo bahut kam baar li jaati hai (sirf genuine need pe), isliye resolution/quality

                stream = await Promise.race([
    navigator.mediaDevices.getUserMedia({ video: { width: 960, height: 720, facingMode: "user" } }),
    new Promise((_, reject) => setTimeout(() => reject(new Error('Camera timeout')), 4000))
]);
                video.srcObject = stream;
                await new Promise(resolve => { video.onloadedmetadata = resolve; video.play(); });
                await new Promise(r => setTimeout(r, 600)); // auto-focus settle

                const ctx = canvas.getContext('2d');
                canvas.width = 960; canvas.height = 720;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const base64Image = canvas.toDataURL('image/jpeg', 0.92).split(',')[1];

                stream.getTracks().forEach(t => t.stop());
                stream = null;
                camIndicator.classList.remove('cam-active');
                logActivity('📷 Photo li gayi (background check).', 'cam');
                return base64Image;
            } catch (err) {
                console.error("Camera error:", err);
                if (stream) stream.getTracks().forEach(t => t.stop());
                camIndicator.classList.remove('cam-active');
                if (err && (err.name === 'NotAllowedError' || err.name === 'SecurityError' || err.name === 'NotFoundError' || err.name === 'NotReadableError')) {
                    cameraAvailable = false;
                    camFixBtn.style.display = 'inline-block';
                    updateStatus("Camera off hai — dobara on karne ke liye button dabao.");
                }
                logActivity('⚠️ Camera error: ' + safeStr(err && err.name), 'error');
                return null;
            }
        }

                }
                if (mergedText !== job.userText) {
                    mergedText = `[SYSTEM: Neeche ek se zyada cheezein ek saath aayi hain — sabka jawab jodkar EK hi natural reply mein do, alag-alag mat bolo.]\n\n${mergedText}`;
                }
            }

            isProcessing = true;
            try {
                await callAIDirect(mergedText, mergedOpts);
            } finally {
                isProcessing = false;
                if (aiQueue.length > 0 && !isOffline) processQueue();
            }
        }

        function clearQueue() { aiQueue.length = 0; }

        // --- v3: connectivity handlers ---
        window.addEventListener('offline', () => {
            isOffline = true;
            logActivity('📶 Net chala gaya — queue pause.', 'system');
            if (!isSpeaking) updateStatus("Offline ho — net wapas aate hi resume.");
        });
        window.addEventListener('online', () => {
            isOffline = false;
            logActivity('📶 Net wapas — queue resume.', 'system');
            processQueue();
        });

        /* ================= 7. THE API CALLER (gemini-2.5-flash + Structured JSON) ================= */
        // Network + retry ka poora kaam yahan isolated hai — sirf FETCH level pe retry hota hai.
        // Isse ek hi logical call (user-message log + bumpApiCount + memory-context) sirf EK baar
        // hoti hai, chahe network me 429/500 ki wajah se 3 baar tak retry karna pade.
        async function fetchGeminiWithRetry(body, modelName, background) {
            const maxRetries = 3;
            let retryCount = 0;
            while (true) {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${API_KEY}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await response.json();

                if (!data.error) return data;

                console.error("API Error:", data.error);
                logActivity('⚠️ API error: ' + safeStr(data.error.message).slice(0, 80) + ' (code ' + safeStr(data.error.code) + ')', 'error');

                const errBlob = safeStr(data.error.status) + ' ' + JSON.stringify(data.error.errors || '') + ' ' + safeStr(data.error.message);
                const is429 = data.error.code === 429;
                const isServerError = data.error.code === 500 || data.error.code === 503 || /INTERNAL|UNAVAILABLE|backendError/i.test(errBlob);

                // Google genuine per-minute rate-limits attach a RetryInfo detail with a retryDelay
                // (e.g. "20s"). Agar ye nahi hai, ya message billing/plan ka zikr karta hai, toh ye
                // ek HARD quota-exhausted block hai (daily/monthly limit ya billing hi off) — chhoti
                // backoff se retry karne ka koi fayda nahi.
                const retryInfo = (data.error.details || []).find(d => /RetryInfo/i.test(safeStr(d && d['@type'])));
                const isHardQuota = is429 && (!retryInfo || /billing|plan/i.test(errBlob));

                if (isHardQuota) {
                    pauseApiCalls(15 * 60000, 'quota/billing exhausted (429, koi retry-hint nahi) — 15 min sab calls pause');
                    data.__paused = true;
                    return data;
                }

                if ((is429 || isServerError) && retryCount < maxRetries) {
                    let waitMs;
                    if (retryInfo && retryInfo.retryDelay) {
                        waitMs = (parseFloat(retryInfo.retryDelay) || 3) * 1000; // Google ne jitna bola utna hi ruko
                    } else {
                        const base = is429 ? 3000 : 1000;
                        waitMs = base * Math.pow(2, retryCount); // exponential-ish backoff: 1s/3s, 3s/6s, 7s/12s
                    }
                    logActivity(`🔁 ${is429 ? 'Rate-limit' : 'Server error'} — ${Math.round(waitMs / 1000)}s baad retry (${retryCount + 1}/${maxRetries})...`, 'system');
                    if (!background) updateStatus(is429 ? "Thoda busy hai — retry..." : "Server glitch — retry...");
                    await new Promise(r => setTimeout(r, waitMs));
                    retryCount++;
                    continue;
                }

                // Na rate-limit hai na server error — schema rejection jaisa kuch non-transient issue ho sakta hai.
                if (useResponseSchema && !is429 && !isServerError) data.__nonTransientSchemaIssue = true;
                return data;
            }
        }

        async function callAIDirect(userText, opts = {}) {
            const { isSystemOverride = false, base64Image = null, background = false } = opts;

            if (muteMinutesRemaining > 0 && !isSystemOverride) {
                updateStatus(`Muted for ${muteMinutesRemaining} more mins.`);
                return;
            }

            // Offline check — net gone toh call na kare, canned line bolo instead
            if (isOffline) {
                if (!background && !isSystemOverride) {
                    setExpression('sad');
                    await speak(CANNED_NET_LINES[Math.floor(Math.random() * CANNED_NET_LINES.length)]);
                }
                logActivity('📶 Call skip — offline hai.', 'system');
                return;
            }

            // Circuit breaker — quota/billing hard-exhausted hone pe kuch der sab calls
            // (background samet) skip, taaki har trigger apna retry-storm na chalaye.
            if (isApiPaused()) {
                if (!background && !isSystemOverride) updateStatus("Thodi der ruko — quota cooldown chal raha hai.");
                logActivity('⏸️ Call skip — API abhi paused hai (quota cooldown).', background ? 'cam' : 'system');
                return;
            }

            // Background photo-checks (idle/sleep observation) should stay visually "normal" —
            // thinking face sirf tab dikhega jab yeh ek real conversation turn ho.
            if (!background) {
                setExpression('thinking');
                updateStatus("Thinking...");
            }
            logActivity((background ? '👀 [Background] ' : isSystemOverride ? '🔧 [System] ' : '🗣️ [User] ') + safeStr(userText).slice(0, 100) + (base64Image ? ' 📷' : ''), background ? 'cam' : isSystemOverride ? 'system' : 'user');

            // v3: build semantic memory context for this call
            await buildMemoryContext(userText);
            bumpApiCount();

            // Background/silent-observe calls ek halka model + chhota prompt + chhota schema use
            // karte hain (alag quota bucket bhi hota hai) — real conversation ka full personality
            // context yahan zaroori nahi, sirf photo dekh ke silent/log-worthy decision leni hai.
            const modelName = background ? LIGHT_MODEL_NAME : MODEL_NAME;
            let parts = [{ "text": (background ? getSystemPromptLight() : getSystemPrompt()) + "\n\n═══ INPUT ═══\n" + userText }];
            if (base64Image) parts.push({ "inline_data": { "mime_type": "image/jpeg", "data": base64Image } });

            const body = { "contents": [{ "parts": parts }] };
            if (useResponseSchema) {
                body.generationConfig = {
                    response_mime_type: "application/json",
                    response_schema: background ? getResponseSchemaLight() : getResponseSchema(),
                    thinkingConfig: { includeThoughts: false }
                };
            }

            let data;
            try {
                data = await fetchGeminiWithRetry(body, modelName, background);
            } catch (error) {
                console.error(error);
                if (!background) { setExpression('sad'); await speak("Network me problem hai boss."); }
                logActivity('⚠️ Network/JS error: ' + safeStr(error && error.message).slice(0, 90), 'error');
                return;
            }

            // API-level error (model not found / quota / schema rejected) — yahan koi retry NAHI,
            // retry sirf fetchGeminiWithRetry ke andar ho chuka hota hai.
            if (data.error) {
                // Schema-related non-transient issue — ek-baari fallback: schema off karke seedha retry.
                // Ye quota/rate-limit se alag hai (rare, aur ek dafa ke baad useResponseSchema hamesha
                // ke liye false ho jaata hai, isliye is path pe dobara nahi aayega).
                if (data.__nonTransientSchemaIssue && useResponseSchema) {
                    useResponseSchema = false;
                    return callAIDirect(userText, opts);
                }
                if (!background) {
                    setExpression('sad');
                    await speak(data.__paused
                        ? "Boss, thodi der rukna padega — API ka quota khatam ho gaya hai."
                        : "API me dikkat hai boss — " + safeStr(data.error.message).slice(0, 80));
                }
                return;
            }

            // Gemma models sometimes emit a "thought" reasoning part BEFORE the real
            // answer part (even when includeThoughts:false is requested — known model
            // quirk). Skip any part flagged thought:true and use the real answer part(s).
            const allParts = data?.candidates?.[0]?.content?.parts || [];
            let rawJSONText = allParts
                .filter(p => !p.thought)
                .map(p => safeStr(p.text))
                .join('')
                .trim();
            // Fallback: if every part was somehow flagged as thought, just use the last part.
            if (!rawJSONText && allParts.length > 0) {
                rawJSONText = safeStr(allParts[allParts.length - 1].text).trim();
            }
            if (!rawJSONText) {
                console.error("Empty AI response:", data);
                if (!background) { setExpression('sad'); updateStatus("AI ne khaali jawab diya."); }
                logActivity('⚠️ AI ne khaali jawab diya.', 'error');
                return;
            }

            rawJSONText = rawJSONText.replace(/```json/gi, '').replace(/```/gi, '').trim();

            let json;
            try {
                json = JSON.parse(rawJSONText);
            } catch (pe) {
                // extract first {...} block as last resort
                const m = rawJSONText.match(/\{[\s\S]*\}/);
                if (m) { try { json = JSON.parse(m[0]); } catch (e2) { json = null; } }
            }
            if (!json) {
                console.error("JSON parse fail:", rawJSONText);
                if (!background) { setExpression('sad'); updateStatus("AI ka jawab samajh nahi aaya."); }
                logActivity('⚠️ AI ka jawab samajh nahi aaya (JSON parse fail).', 'error');
                return;
            }

            // AI ne khud decide kiya ki is sawal ka jawab dene ke liye dekhna zaroori hai —
            // poora camera control AI ke paas hai, koi fixed keyword-list nahi. Ek genuine
            // follow-up call karte hain, is baar photo ke saath, taaki asli jawab mil sake.
            if (json.request_photo === true && !background && !base64Image && !opts._photoRoundDone) {
                await executeAICommands(json, userText); // chhota filler bol sakta hai ("Ek second, dekhta hu...")
                logActivity('📷 AI ne khud photo maangi — camera on kar raha hu.', 'cam');
                const photo = await takeSnapshot();
                if (!photo) return; // camera na mile toh filler jawab hi final rah jaata hai
                return callAIDirect(userText + "\n[PHOTO ATTACHED — ISI SAWAL KA FOLLOW-UP HAI]", { ...opts, base64Image: photo, _photoRoundDone: true });
            }

            await executeAICommands(json, userText);
        }

        /* ================= 8. JSON EXECUTION ENGINE ================= */
        async function executeAICommands(json, userText = "") {
            console.log("AI Internal:", json);
            json = json || {};
            const sysCmds = json.system_commands || {};
            const memUpd = json.memory_updates || {};
            const selfDec = json.self_decision || {};

            // --- System commands ---
            if (safeNum(sysCmds.mute_system_for_minutes) > 0) {
                muteMinutesRemaining = Math.min(safeNum(sysCmds.mute_system_for_minutes), 720);
                mouth.classList.add('muted-visual');
                // Persist to Firebase so reload/app-restart mute nahi toot-ta
                db.ref('buddy/system/muteUntil').set(Date.now() + muteMinutesRemaining * 60000);
                updateStatus(`Muted for ${muteMinutesRemaining} mins.`);
                renderMuteStatus();

            if (sysCmds.add_task && safeStr(sysCmds.add_task.task)) {

                logActivity('✅ Task complete hua: ' + safeStr(t.task).slice(0, 80), 'task');
            }

            if (safeStr(sysCmds.mute_task_id) && savedTasks[safeStr(sysCmds.mute_task_id)]) {

                db.ref('buddy/tasks/' + safeStr(sysCmds.mute_task_id)).set(t);
                logActivity('🔇 Task ke reminders band kiye (user ne mana kiya): ' + safeStr(t.task).slice(0, 80) + ' — is baar ' + (t.timesReminded || 0) + ' reminder de chuke the', 'task');
            }

            // --- Memory updates (disciplined) ---
            if (safeStr(memUpd.new_fact)) {
                memFacts = trimTo(memFacts + " | " + safeStr(memUpd.new_fact), MEM_LIMITS.facts);
                db.ref('buddy/memory/facts').set(memFacts);
                maybeSummarize('facts');

            if (safeStr(memUpd.learned_habit)) {
                memHabits = trimTo(memHabits + " | " + safeStr(memUpd.learned_habit), MEM_LIMITS.habits);
                db.ref('buddy/memory/habits').set(memHabits);

                logActivity('🔁 Habit note ki: ' + safeStr(memUpd.learned_habit).slice(0, 80), 'memory');
            }
            if (safeStr(memUpd.add_new_rule)) {
                memRules = trimTo(memRules + " | " + safeStr(memUpd.add_new_rule), MEM_LIMITS.rules);
                db.ref('buddy/memory/rules').set(memRules);
                maybeSummarize('rules');
                logActivity('📏 Naya rule add hua: ' + safeStr(memUpd.add_new_rule).slice(0, 80), 'memory');
            }
            if (safeStr(memUpd.observation_note)) {
                memHourlySummary = trimTo(memHourlySummary + " " + safeStr(memUpd.observation_note), MEM_LIMITS.hourlySummary);
                db.ref('buddy/memory/hourlySummary').set(memHourlySummary);
                logActivity('👀 Observation note: ' + safeStr(memUpd.observation_note).slice(0, 80), 'memory');
                appendTimeline(safeStr(memUpd.observation_note), 'observation');
                addMemoryItem(safeStr(memUpd.observation_note), 'observation');
            }

            // v3: structured profile_update
            if (memUpd.profile_update && memUpd.profile_update.field) {

            }
            // v3.2: structured people directory (friends/family — name, relation, episodic log)
            if (memUpd.person_update && safeStr(memUpd.person_update.name)) {
                upsertPerson(memUpd.person_update);
            }
            // v3: discrete memory item (semantic retrieval)
            if (memUpd.add_memory_item && safeStr(memUpd.add_memory_item.text)) {
                addMemoryItem(safeStr(memUpd.add_memory_item.text), safeStr(memUpd.add_memory_item.tag) || 'fact');
            }
            // ALSO mirror new_fact / learned_habit into memoryItems + timeline
            if (safeStr(memUpd.new_fact)) {

                appendTimeline(safeStr(memUpd.new_fact), 'fact');

            // v3: new system_commands
            if (safeStr(sysCmds.launch_game) === 'tic_tac_toe') {

            }
            if (tttActive && !tttGameOver && typeof sysCmds.ttt_move === 'number') {

            if (sysCmds.start_roast_battle === true) {

                    logActivity(`🔥 Roast round done — winner: ${w} (User ${roastScore.user}-${roastScore.buddy} Buddy)`, 'system');
                    if (roastRound > 5) triggerRoastEnd();

                db.ref('buddy/dailyChallenge').set(dailyChallenge);

            if (sysCmds.search_memory && (safeStr(sysCmds.search_memory.query) || safeStr(sysCmds.search_memory))) {

                const isObj = typeof sysCmds.search_memory === 'object';
                window._pendingMemorySearch = isObj ? safeStr(sysCmds.search_memory.query) : safeStr(sysCmds.search_memory);
                window._pendingMemorySearchFolder = isObj ? safeStr(sysCmds.search_memory.folder) : '';
                logActivity('🔍 Memory search queued' + (window._pendingMemorySearchFolder ? ` [folder: ${window._pendingMemorySearchFolder}]` : '') + ': ' + window._pendingMemorySearch.slice(0, 60), 'memory');

            // --- Habit & mood logging ---
            if (safeStr(json.detected_mood) && json.detected_mood !== 'unknown') {
                const k = todayKey();
                if (!moodLog[k]) moodLog[k] = {};
                moodLog[k][json.detected_mood] = (moodLog[k][json.detected_mood] || 0) + 1;
                db.ref('buddy/moodLog/' + k).set(moodLog[k]);
                logActivity('😊 Mood detect hua: ' + safeStr(json.detected_mood), 'mood');
            }
            if (safeStr(json.observed_dress)) {
                logDress(safeStr(json.observed_dress));
            }
            if (safeStr(json.detected_activity) && json.detected_activity !== 'unknown') {
                lastDetectedActivity = safeStr(json.detected_activity);
                studyStreak = lastDetectedActivity === 'studying' ? studyStreak + 1 : 0;
            }
            if (json.user_present === false) {
                db.ref('buddy/lastEmptyChair').set(Date.now());
            }
            // Stranger privacy mode — AI ne naya insaan mention kiya ho (thought/note me) toh 15 min reserved mode
            const strangerProbe = (safeStr(json.internal_thought) + ' ' + safeStr(memUpd.observation_note)).toLowerCase();
            if (json.user_present === true && /stranger|naya insaan|naye insaan|unknown person|kaun hai/.test(strangerProbe)) {
                window._strangerDetectedAt = Date.now();
                logActivity('🕵️ Stranger detect — personal facts 15 min ke liye reserved.', 'system');
            }

            // --- Self decision (pet behaviour) ---
            handleSelfDecision(selfDec, sysCmds);

            // --- Speak or stay silent ---
            const speechText = safeStr(json.speech_text).trim();
            if (json.action === "speak" && speechText) {
                isSleeping = false;
                setExpression(safeStr(json.emotion_to_show) || 'normal');
                const delay = Math.min(Math.max(safeNum(json.thinking_delay_ms, 0), 0), 2500);
                if (delay > 0) {
                    updateStatus("Hmm...");
                    await new Promise(r => setTimeout(r, delay));

                pushHistory('buddy', speechText);
                lastBuddySpokeAt = Date.now();
                awaitingUserReply = true;
                logActivity('💬 Buddy bola: ' + speechText.slice(0, 100), 'reply');
                // speak() ab poore audio (TTS fetch + playback) khatam hone tak await hota hai —
                // mic khudba-khud sahi time pe on hota hai (speak() ke andar hi scheduleMicResume
                // call hoti hai), isliye yahan alag se koi jaldi wala scheduleMicResume nahi chahiye.
                await speak(speechText, safeStr(json.emotion_to_show), {
                    pitch: safeNum(json.pitch, NaN),
                    rate: safeNum(json.rate, NaN),
                    whisper: json.whisper_mode === true
                });
            } else {
                setExpression(safeStr(json.emotion_to_show) || 'normal');
                const thought = safeStr(json.internal_thought);
                updateStatus(thought || "...");
                logActivity('🤔 Buddy chup raha. Thought: ' + (thought || '—').slice(0, 90), 'system');
                if (thought.toLowerCase().includes("so jao") || json.emotion_to_show === "sleeping") {
                    isSleeping = true; setExpression('sleeping');
