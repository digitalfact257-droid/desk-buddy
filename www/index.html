        /* ================= 12b. IDLE-FUN (pure client-side, zero API) ================= */
        function scheduleIdleFun() {
            clearTimeout(idleFunTimer);
            const delay = 15000 + Math.random() * 5000; // 15-20 sec
            idleFunTimer = setTimeout(runIdleFunTick, delay);
        }

        function stopIdleFun() {
            clearTimeout(idleFunTimer);
            idleFunTimer = null;
            face.classList.remove('look-left', 'look-right', 'look-up');
        }

        function runIdleFunTick() {
            // Safety: agar conversation wapas shuru ho gayi ya kuch aur process ho raha hai, chup ho jao
            if (conversationActive || isSpeaking || isProcessing) { idleFunTimer = null; return; }

            if (isSleeping) {
                // 25% chance: neend se khud utth ke random game khelta hai. Baaki 75% halka "sapne wala" flash.
                if (Math.random() < 0.25) {
                    isSleeping = false;
                    runBoredSequence(pickBoredVariant()); // kai variants khud hi wapas so jaate hain end me
                } else {
                    const dreamExpr = IDLE_DREAM_SET[Math.floor(Math.random() * IDLE_DREAM_SET.length)];
                    setExpression(dreamExpr);
                    setTimeout(() => { if (isSleeping) setExpression('sleeping'); }, 700 + Math.random() * 400);
                }
            } else {
                const roll = Math.random();
                if (roll < 0.4) {
                    // idhar-udhar dekhna
                    const dir = IDLE_LOOK_DIRS[Math.floor(Math.random() * IDLE_LOOK_DIRS.length)];
                    face.classList.add(dir);
                    setTimeout(() => face.classList.remove(dir), 900 + Math.random() * 500);
                } else if (roll < 0.75) {
                    // alag expression
                    setExpression(IDLE_EXPR_SET[Math.floor(Math.random() * IDLE_EXPR_SET.length)]);
                } else {
                    // khud khelna — pehle se bana hua client-side self-play reuse
                    runBoredSequence(pickBoredVariant());
                }
            }
            scheduleIdleFun();
        }
        /* ================= 13. TEXT-TO-SPEECH (Dynamic pitch/rate + Night Whisper) ================= */
        function pickVoice() {
            const voices = window.speechSynthesis.getVoices();
            return voices.find(v => /hi[-_]IN/i.test(v.lang))
                || voices.find(v => /^hi/i.test(v.lang))
                || voices.find(v => /en[-_]IN/i.test(v.lang))
                || null;
        }

        // --- Magpie TTS (NVIDIA) audio plumbing ---
        let ttsAudioCtx = null;
        function getTtsAudioCtx() {
            if (!ttsAudioCtx) ttsAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            return ttsAudioCtx;
        }
        let currentTtsSource = null;

        // Pehli baar /list_voices call karke hi-IN ka koi bhi available voice dhoondh ke cache kar leta hai
        // (specific voice maangi nahi gayi — jo bhi mile wahi chalega). Fail ho jaye toh ek reasonable guess use hoga.
        async function getMagpieHindiVoice() {
            if (magpieVoiceName) return magpieVoiceName;
            try {
                const res = await fetch(`${MAGPIE_PROXY_URL}?action=list_voices`);
                const data = await res.json();
                for (const localesKey in data) {
                    if (localesKey.split(',').map(s => s.trim()).includes(MAGPIE_LANGUAGE)) {
                        const voices = data[localesKey].voices || [];
                        // base voice name prefer karo (bina .Happy/.Angry jaisa emotion suffix ke)
                        const base = voices.find(v => v.startsWith(`Magpie-Multilingual.${MAGPIE_LANGUAGE.toUpperCase()}.`) && v.split('.').length === 3);
                        magpieVoiceName = base || voices.find(v => v.toUpperCase().includes(MAGPIE_LANGUAGE.toUpperCase())) || voices[0];
                        // v3.4: emotion-suffixed variants (.Happy/.Angry/.Sad etc.) bhi yahin cache kar lo —
                        // pehle ye discover hoke bhi discard ho jaate the, aur unki jagah base voice ko
                        // client-side pitch-shift (detune) karke "fake" emotion banaya jaata tha, jo
                        // pronunciation distort kar deta tha. Ab asli emotion-voice use hogi.
                        if (magpieVoiceName) {
                            const prefix = magpieVoiceName + '.';
                            magpieVoiceVariants = {};
                            voices.forEach(v => {
                                if (v.startsWith(prefix)) {
                                    const suffix = v.slice(prefix.length); // e.g. "Happy"
                                    if (suffix && !suffix.includes('.')) magpieVoiceVariants[suffix.toLowerCase()] = v;
                                }
                            });
                            return magpieVoiceName;
                        }
                    }
                }
            } catch (e) { /* neeche fallback guess use hoga */ }
            magpieVoiceName = `Magpie-Multilingual.${MAGPIE_LANGUAGE.toUpperCase()}.Aria`; // guess, agar discovery fail ho jaye
            if (!magpieVoiceVariants) magpieVoiceVariants = {};
            return magpieVoiceName;
        }

        // Emotion ke naam ko Magpie ke apne emotion-voice suffixes se map karta hai.
        // Agar wo specific emotion-voice available na ho, base (neutral) voice pe fallback hota hai —
        // ismein koi pitch-shift/detune nahi lagta, isliye pronunciation clean rehta hai.
        const EMOTION_TO_MAGPIE_SUFFIX = {
            angry: 'angry', annoyed: 'angry', grumpy: 'angry',
            sad: 'sad', crying: 'sad',
            happy: 'happy', excited: 'happy', proud: 'happy',
            surprised: 'surprised',
            sleepy: 'sad', sleeping: 'sad',
            whistling: 'happy'
        };
        async function getMagpieVoiceForEmotion(emotion) {
            const base = await getMagpieHindiVoice();
            const suffix = EMOTION_TO_MAGPIE_SUFFIX[emotion];
            if (suffix && magpieVoiceVariants && magpieVoiceVariants[suffix]) {
                return magpieVoiceVariants[suffix];
            }
            return base;
        }

        // v3.3: VOICE TUNING FIX — pehle emotion ke hisaab se pitch 0.85–1.5 tak jump karta tha,
        // jisse har baar ek "alag" awaaz lagti thi aur high-pitch wale emotions (happy/angry) me
        // "cat/chipmunk" jaisa artifact aata tha (pre-recorded voice ko itna upar pitch-shift karne
        // ka side-effect). Ab range bohot tang (0.93–1.12) hai — voice hamesha consistent/normal
        // sunegi, sirf halka sa emotional hint milega, extreme squeaky effect nahi aayega.
        // Volume bhi thoda boost kiya gaya hai (1.0 → 1.3) taaki awaaz zyada aaye.
        function computeVoiceParams(emotion, opts, isNight) {
            let pitch = 1.0, rate = 1.0, volume = 2.4; // v3.4: volume 1.3 -> 2.4, awaaz kaafi zyada aayegi ab
            if (emotion === 'angry') { pitch = 1.12; rate = 1.15; }
            else if (emotion === 'sad') { pitch = 0.95; rate = 0.9; }
            else if (emotion === 'sleeping') { pitch = 0.93; rate = 0.85; }
            else if (emotion === 'happy' || emotion === 'surprised') { pitch = 1.08; rate = 1.05; }

            // AI-provided overrides — range bhi tang kiya (pehle 0.5–2.0 allow karta tha, jo
            // AI ko bhi kabhi-kabhi extreme "cat" pitch maangne deta tha)
            if (!isNaN(opts.pitch)) pitch = Math.min(Math.max(opts.pitch, 0.88), 1.15);
            if (!isNaN(opts.rate)) rate = Math.min(Math.max(opts.rate, 0.75), 1.25);

            if (opts.whisper || isNight) {
                volume = Math.min(volume, 1.1); // whisper me phir bhi normal se halka hi rahega, par ab pehle se zyada saaf sunega
                rate = Math.min(rate, 0.85);
                pitch = Math.min(pitch, 1.0);
            }
            return { pitch, rate, volume };
        }

        // speak() ab ek Promise return karta hai jo TABHI resolve hota hai jab audio
        // SACH ME khatam ho jaaye (ya poori tarah fail ho jaaye) — na ki jaise hi
        // playback shuru hota hai. Isi wajah se mic "thinking"/TTS-network-fetch ke
        // dauran wapas on ho jaata tha (asli bug) — ab caller isko await karke hi
        // aage badhta hai, isliye mic Buddy ke poora bol chukne ke BAAD hi khulta hai.
        function speak(text, emotion, opts = {}) {
            const hour = new Date().getHours();
            const isNight = (hour >= 23 || hour < 6);
            let { pitch, rate, volume } = computeVoiceParams(emotion, opts, isNight);

            return new Promise((resolve) => {
                (async () => {
                    try {
                        if (currentTtsSource) { try { currentTtsSource.stop(); } catch (e) {} currentTtsSource = null; }

                        // v3.4: base voice ko pitch-shift (detune) karke fake emotion banane ke bajaye,
                        // Magpie ki apni real emotion-voice (agar available ho) use karo — isse
                        // pronunciation clean rehta hai, artifact/distortion nahi aata.
                        const voice = await getMagpieVoiceForEmotion(emotion);

                        // v3.3: Ek chhota retry (max 2 attempts) — agar network/timeout ki wajah se
                        // pehli koshish fail ho, seedha browser-voice pe switch karne se pehle ek
                        // aur try kar lo. Isse "achanak voice change" kam hoga, kyunki transient
                        // glitches par bhi Magpie ki hi awaaz bani rahegi, alag browser-voice pe nahi kudegi.
                        let audioBuffer = null, lastErr = null;
                        for (let attempt = 0; attempt < 2 && !audioBuffer; attempt++) {
                            try {
                                const form = new FormData();
                                form.append("text", text);
                                form.append("language", MAGPIE_LANGUAGE);
                                form.append("voice", voice);
                                form.append("encoding", "LINEAR_PCM");
                                form.append("sample_rate_hz", "44100");

                                const controller = new AbortController();
                                const timeoutId = setTimeout(() => controller.abort(), 12000);
                                const response = await fetch(`${MAGPIE_PROXY_URL}?action=synthesize`, {
                                    method: "POST", body: form, signal: controller.signal
                                });
                                clearTimeout(timeoutId);
                                if (!response.ok) throw new Error("Magpie TTS: HTTP " + response.status + " — " + await response.text());

                                const wavBytes = await response.arrayBuffer();
                                const ctx = getTtsAudioCtx();
                                if (ctx.state === 'suspended') await ctx.resume();
                                audioBuffer = await ctx.decodeAudioData(wavBytes);
                            } catch (e) {
                                lastErr = e;
                                if (attempt === 0) await new Promise(r => setTimeout(r, 300)); // ek chhota gap, phir dobara try
                            }
                        }
                        if (!audioBuffer) throw lastErr || new Error("Magpie TTS: unknown failure after retry");

                        const ctx = getTtsAudioCtx();
                        const source = ctx.createBufferSource();
                        source.buffer = audioBuffer;
                        source.playbackRate.value = rate;
                        // v3.4: detune/pitch-shift hata diya — Magpie ki asli emotion-voice (upar select ki gayi)
                        // already emotion carry karti hai, isliye upar se pitch-bend lagane ki zaroorat nahi.
                        // Ye hi woh cheez thi jo words ko distort/galat-pronounce kar deti thi.
                        source.detune.value = 0;

                        const gainNode = ctx.createGain();
                        gainNode.gain.value = volume;
                        source.connect(gainNode).connect(ctx.destination);
                        currentTtsSource = source;

                        source.onended = () => {
                            if (currentTtsSource === source) currentTtsSource = null;
                            isSpeaking = false; mouth.classList.remove('talking-mouth');
                            updateStatus("Waiting...");
                            if (conversationActive) scheduleMicResume(400);
                            resolve();
                        };

                        isSpeaking = true; mouth.classList.add('talking-mouth'); updateStatus(`Buddy: ${text}`);
                        source.start(0);
                    } catch (err) {
                        // Magpie TTS dono attempt me fail ho jaye (network/quota/rate-limit/etc.) toh
                        // buddy chup na rahe — browser TTS pe fallback
                        logActivity('⚠️ Magpie TTS fail (retry ke baad bhi), browser voice pe fallback: ' + err.message, 'error');
                        await speakBrowserFallback(text, emotion, opts);
                        resolve();
                    }
                })();
            });
        }

        // Purana browser-voice tarika — sirf Magpie TTS fail hone par backup ke taur par.
        // Ye bhi ek Promise return karta hai jo utterance sach me khatam hone par hi resolve hota hai.
        function speakBrowserFallback(text, emotion, opts = {}) {
            return new Promise((resolve) => {
                if (!('speechSynthesis' in window)) { resolve(); return; }
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'hi-IN';
                const v = pickVoice();
                if (v) utterance.voice = v;

                const hour = new Date().getHours();
                const isNight = (hour >= 23 || hour < 6);
                let { pitch, rate, volume } = computeVoiceParams(emotion, opts, isNight);
                volume = Math.min(volume, 1.0); // browser SpeechSynthesis API ka max volume 1.0 hai, isse zyada allowed nahi

                utterance.pitch = pitch;
                utterance.rate = rate;
                utterance.volume = volume;

                utterance.onstart = () => { isSpeaking = true; mouth.classList.add('talking-mouth'); updateStatus(`Buddy: ${text}`); };
                utterance.onend = () => {
                    isSpeaking = false; mouth.classList.remove('talking-mouth');
                    updateStatus("Waiting...");
                    if (conversationActive) scheduleMicResume(400);
                    resolve();
                };
                utterance.onerror = () => {
                    isSpeaking = false; mouth.classList.remove('talking-mouth');
                    if (conversationActive) scheduleMicResume(600);
                    resolve();
                };
                window.speechSynthesis.speak(utterance);
            });
        }

        function cancelSpeech() {
            window.speechSynthesis.cancel();
            if (currentTtsSource) { try { currentTtsSource.stop(); } catch (e) {} currentTtsSource = null; }
            isSpeaking = false;
            mouth.classList.remove('talking-mouth');
            updateStatus("Interrupted.");
        }

        /* ============ 13.5 NATIVE SPEECH BRIDGE (sirf Android APK ke liye — browser code untouched) ============ */
        // Capacitor ke andar chalne par window.Capacitor milta hai. Browser me ye false rahega
        // aur neeche wala purana webkitSpeechRecognition code bilkul waise hi chalega.
        const IS_NATIVE_APP = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
        let nativeSttReady = false;
        let nativeSttAvailable = false;

        // Native mic se aaya FINAL transcript — browser wale onresult ka exact same behavior,
        // taaki chup/bye/unmute/mood/history sab ek jaisa kaam kare.
        function nativeHandleTranscript(text) {
            const userSpeech = safeStr(text || '').trim();
            if (!userSpeech) return;

            // Self-voice feedback protection: jab TTS bol raha hai tab sirf interrupt-keywords process karo
            if (isSpeaking) {
                if (/^(chup|shut up|bas kar|band kar|quiet|ruk|bas)/i.test(userSpeech)) {
                    cancelSpeech();
                    updateStatus("Theek hai, chup.");
                    logActivity('\u{1FAE4} User ne bolne ke dauran interrupt kiya.', 'user');
                }
                return;
            }

            if (/^(chup|shut up|bas kar|band kar|quiet|ruk)/i.test(userSpeech)) {
                cancelSpeech();
                updateStatus("Theek hai, chup.");
                logActivity('\u{1FAE4} User ne "chup" bola — Buddy ruk gaya.', 'user');
                return;
            }

            if (muteMinutesRemaining > 0 && /\b(buddy\s*bol|wapas\s*aa\s*ja|unmute|bol\s*na|bol\s*yaar)\b/i.test(userSpeech)) {
                muteMinutesRemaining = 0;
                db.ref('buddy/system/muteUntil').set(0);
                mouth.classList.remove('muted-visual');
                renderMuteStatus();
                updateStatus("Wapas aa gaya!");
                logActivity('\u{1F507} User ne quick-unmute bola.', 'user');
                return;
            }

            if (/\b(bye(\s*bye)?|good\s*bye|good\s*night|alvida|tata|chalta\s*hu(n)?|nikal(ta|te)?\s*(hu|hoon|hain)|so\s*(raha|jaa|jaata)\s*hu(n)?)\b/i.test(userSpeech)) {
                updateStatus(`You: ${userSpeech}`);
                pushHistory('user', userSpeech);
                logActivity('\u{1F44B} User: ' + userSpeech.slice(0, 100), 'user');
                bumpInteractions();
                recordReply();
                logActivity('\u{1F51A} Conversation khatam — mic band ho gaya.', 'system');
                endConversation();
                enqueueCall(userSpeech + "\n[SYSTEM NOTE]: User ne baat khatam kar di (bye bola). Ek chhota warm farewell bolo — max 1 line, phir chup ho jao.", { isSystemOverride: true });
                return;
            }

            updateStatus(`You: ${userSpeech}`);
            logActivity('\u{1F5E3}\uFE0F User bola: ' + userSpeech.slice(0, 100), 'user');
            pushHistory('user', userSpeech);
            bumpInteractions();
            recordReply();
            awaitingUserReply = false;
            lastRealInteractionAt = Date.now();
            buddyMood = Math.max(0, buddyMood - 40);
            saveAiState();
            enterConversationMode();
            enqueueCall(userSpeech, { isSystemOverride: isInstantRequest(userSpeech) });
        }

        // App start pe ek baar: availability + mic/camera permission + listeners
        async function nativeSttInit() {
            if (!IS_NATIVE_APP || nativeSttReady) return;
            try {
                const SR = window.Capacitor.Plugins && window.Capacitor.Plugins.SpeechRecognition;
                if (!SR) throw new Error('SpeechRecognition plugin load nahi hua');

                const avail = await SR.available();
                nativeSttAvailable = !!(avail && avail.available);
                if (!nativeSttAvailable) { logActivity('\u26A0\uFE0F Is phone me speech recognition available nahi hai.', 'error'); return; }

                // Camera permission bhi yahin — face/emotion detection (getUserMedia) ke liye
                try {
                    if (window.Capacitor.Plugins.Camera) {
                        const camPerm = await window.Capacitor.Plugins.Camera.requestPermissions({ permissions: ['camera'] });
                        if (!camPerm || camPerm.camera !== 'granted') logActivity('\u26A0\uFE0F Camera permission nahi mili — camera feature band rahega.', 'error');
                    }
                } catch (e) { console.warn('Camera permission error:', e); }

                let perm = await SR.checkPermissions();
                if (perm.speechRecognition !== 'granted') perm = await SR.requestPermissions();
                if (perm.speechRecognition !== 'granted') {
                    nativeSttAvailable = false;
                    updateStatus("Mic permission nahi mili.");
                    logActivity('\u26A0\uFE0F Mic permission deny ho gayi — voice input band.', 'error');
                    return;
                }

                // listening start/stop = browser ke onstart/onend jaisa
                SR.addListener('listeningState', (data) => {
                    if (data && data.status === 'started') {
                        isListening = true;
                        talkBtn.classList.add('active');
                        talkBtn.innerText = "Listening...";
                        logActivity('\u{1F3A4} Mic on — sun raha hai...', 'system');
                    } else {
                        // Android me true continuous mode hota hi nahi (platform limit) —
                        // isliye jaise hi ruke, conversation chalu hai toh 300ms me wapas start.
                        isListening = false;
                        if (conversationActive && !isSpeaking && muteMinutesRemaining === 0) {
                            scheduleMicResume(300);
                        } else {
                            talkBtn.classList.remove('active');
                            talkBtn.innerText = "\u{1F3A4} Speak";
                        }
                    }
                });

                nativeSttReady = true;
                logActivity('\u2705 Native mic ready (Android speech engine).', 'system');
            } catch (e) {
                nativeSttAvailable = false;
                console.warn('Native STT init fail:', e);
            }
        }

        // Ek listening session start; FINAL result promise se aata hai (partialResults:false — double-fire nahi)
        async function nativeStart() {
            if (!nativeSttAvailable || isListening) return;
            try {
                const res = await window.Capacitor.Plugins.SpeechRecognition.start({
                    language: 'hi-IN',
                    maxResults: 1,
                    partialResults: false,
                    popup: false
                });
                if (res && res.matches && res.matches.length) nativeHandleTranscript(res.matches[0]);
            } catch (e) {
                // cancel / kuch sunai nahi diya — normal hai, agla session schedule ho jayega
                console.warn('native start result:', e);
            }
        }

        function nativeStop() {
            try { window.Capacitor.Plugins.SpeechRecognition.stop(); } catch (e) {}
        }

        /* ================= 14. SPEECH-TO-TEXT (Continuous conversation mode) ================= */
        const SpeechRecognition = (IS_NATIVE_APP) ? null : (window.SpeechRecognition || window.webkitSpeechRecognition); // native APK me browser STT band
        let recognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = false;
            recognition.lang = 'hi-IN'; // Hindi + Hinglish dono pakdega

            recognition.onstart = () => {
                isListening = true;
                talkBtn.classList.add('active');
                talkBtn.innerText = "Listening...";
                logActivity('🎤 Mic on — sun raha hai...', 'system');
            };

            recognition.onresult = async (event) => {
                const last = event.results[event.results.length - 1];
                if (!last.isFinal) return;
                const userSpeech = safeStr(last[0].transcript).trim();
                if (!userSpeech) return;

                // Self-voice feedback protection: jab TTS bol raha hai tab sirf interrupt-keywords process karo
                if (isSpeaking) {
                    if (/^(chup|shut up|bas kar|band kar|quiet|ruk|bas)/i.test(userSpeech)) {
                        cancelSpeech();
                        updateStatus("Theek hai, chup.");
                        logActivity('🤫 User ne bolne ke dauran interrupt kiya.', 'user');
                    }
                    // baaki sab silently ignore — apni hi awaaz mic me leak ho sakti hai
                    return;
                }

                // "Chup" interrupt — sirf bolna band, sunna chalu rahega
                if (/^(chup|shut up|bas kar|band kar|quiet|ruk)/i.test(userSpeech)) {
                    cancelSpeech();
                    updateStatus("Theek hai, chup.");
                    logActivity('🤫 User ne "chup" bola — Buddy ruk gaya.', 'user');
                    return;
                }

                // Quick-unmute voice phrase — mute ke dauran turant hataao
                if (muteMinutesRemaining > 0 && /\b(buddy\s*bol|wapas\s*aa\s*ja|unmute|bol\s*na|bol\s*yaar)\b/i.test(userSpeech)) {
                    muteMinutesRemaining = 0;
                    db.ref('buddy/system/muteUntil').set(0);
                    mouth.classList.remove('muted-visual');
                    renderMuteStatus();
                    updateStatus("Wapas aa gaya!");
                    logActivity('🔇 User ne quick-unmute bola.', 'user');
                    return;
                }

                // Goodbye phrases — poori conversation band, mic bhi turant band (3-min wait nahi)
                if (/\b(bye(\s*bye)?|good\s*bye|good\s*night|alvida|tata|chalta\s*hu(n)?|nikal(ta|te)?\s*(hu|hoon|hain)|so\s*(raha|jaa|jaata)\s*hu(n)?)\b/i.test(userSpeech)) {
                    updateStatus(`You: ${userSpeech}`);
                    pushHistory('user', userSpeech);
                    logActivity('👋 User: ' + userSpeech.slice(0, 100), 'user');
                    bumpInteractions();
                    recordReply();
                    logActivity('🔚 Conversation khatam — mic band ho gaya.', 'system');
                    endConversation();
                    enqueueCall(userSpeech + "\n[SYSTEM NOTE]: User ne baat khatam kar di (bye bola). Ek chhota warm farewell bolo — max 1 line, phir chup ho jao.", { isSystemOverride: true });
                    return;
                }

                updateStatus(`You: ${userSpeech}`);
                logActivity('🗣️ User bola: ' + userSpeech.slice(0, 100), 'user');
                pushHistory('user', userSpeech);
                bumpInteractions();
                recordReply(); // preference learning: user replied
                awaitingUserReply = false;
                lastRealInteractionAt = Date.now(); // boredom clock reset — user abhi active hai
                buddyMood = Math.max(0, buddyMood - 40); // dhyan mil gaya, restlessness kam ho gayi
                saveAiState();



                // Enter/refresh conversation mode
                enterConversationMode();

                // Instant request? bypass queue priority
                // Photo yahan kabhi upfront nahi li jaati — AI khud decide karega (request_photo
                // field se) agar sawal ka jawab dene ke liye dekhna zaroori hai. Poora camera
                // control AI ke paas hai, keyword-matching pe nahi.
                enqueueCall(userSpeech, { isSystemOverride: isInstantRequest(userSpeech) });
            };

            recognition.onerror = (e) => {
                // 'no-speech' is expected/normal in continuous mode — silently ignore, no log spam
                if (e.error === 'no-speech' || e.error === 'aborted') return;
                console.warn("STT error:", e.error);
                if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
                    conversationActive = false;
                    updateStatus("Mic permission nahi mili.");
                }
                logActivity('⚠️ Mic error: ' + safeStr(e.error), 'error');
            };

            recognition.onend = () => {
                isListening = false;
                if (conversationActive && !isSpeaking && muteMinutesRemaining === 0) {
                    // keep the conversation alive
                    scheduleMicResume(300);
                } else {
                    talkBtn.classList.remove('active');
                    talkBtn.innerText = "🎤 Speak";
                }
            };
        }

        let micResumeTimer = null;
        function scheduleMicResume(delay) {
            clearTimeout(micResumeTimer);
            micResumeTimer = setTimeout(() => {
                if (conversationActive && !isListening && !isSpeaking && !isProcessing) {
                    if (IS_NATIVE_APP) { nativeStart(); } // native: naya listening session
                    else if (recognition) { try { recognition.start(); } catch (e) { /* already started */ } }
                }
            }, delay);
        }

        function enterConversationMode() {
            stopIdleFun(); // real conversation shuru — idle-fun band
            conversationActive = true;
            observationIntervalTime = 600000; // 10 min — pehle 1 min tha, background checks conversation ke saath quota nahi khaayenge ab
            startObservationLoop();
            clearTimeout(activeChatTimeout);
            clearTimeout(conversationSilenceTimer);
            conversationSilenceTimer = setTimeout(() => {
                // 3 min silence → conversation mode off, back to 5-min observation
                if (awaitingUserReply) recordIgnore();
                endConversation();
            }, 180000);
        }

        // Turant conversation band karo — "bye" bolne pe ya 3-min silence pe. Mic band, timers clear.
        function endConversation() {
            conversationActive = false;
            clearTimeout(conversationSilenceTimer);
            clearTimeout(micResumeTimer);
            try { if (IS_NATIVE_APP) { nativeStop(); } else if (recognition && isListening) recognition.stop(); } catch (e) {}
            talkBtn.classList.remove('active');
            talkBtn.innerText = "🎤 Speak";
            observationIntervalTime = 300000;
            startObservationLoop();
            awaitingUserReply = false;
            scheduleIdleFun(); // conversation khatam — ab idle-fun (zero API) shuru
        }

        async function startListening() {
            if (muteMinutesRemaining > 0) { updateStatus(`Muted for ${muteMinutesRemaining} more mins.`); return; }
            if (isSleeping) { isSleeping = false; setExpression('surprised'); }
            if (IS_NATIVE_APP) {
                if (!nativeSttReady) await nativeSttInit();
                if (!nativeSttAvailable) { updateStatus("Is phone me voice input support nahi hai."); logActivity('\u26A0\uFE0F Native speech recognition available nahi hai.', 'error'); return; }
                enterConversationMode();
                if (!isListening) { cancelSpeech(); nativeStart(); }
                return;
            }
            if (!recognition) { updateStatus("Browser speech support nahi hai."); logActivity('\u26A0\uFE0F Is browser/APK mein voice input support nahi hai.', 'error'); return; }
            enterConversationMode();
            if (!isListening) {
                cancelSpeech();
                try { recognition.start(); } catch (e) { /* already running */ }
            }
        }

        /* ================= 15. PREFERENCE LEARNING (replies vs ignores) ================= */
        function recordReply() {
            const k = todayKey();
            if (!interactionStats[k]) interactionStats[k] = { replies: 0, ignores: 0 };
            interactionStats[k].replies = (interactionStats[k].replies || 0) + 1;
            db.ref('buddy/interactionStats/' + k).set(interactionStats[k]);
        }
        function recordIgnore() {
            const k = todayKey();
            if (!interactionStats[k]) interactionStats[k] = { replies: 0, ignores: 0 };
            interactionStats[k].ignores = (interactionStats[k].ignores || 0) + 1;
            db.ref('buddy/interactionStats/' + k).set(interactionStats[k]);
        }

        /* ================= 16. UI & STARTUP LOGIC ================= */
        const VALID_EXPRESSIONS = ['normal', 'happy', 'angry', 'sad', 'thinking', 'sleeping', 'surprised',
            'bored', 'confused', 'laughing', 'smirk', 'shy', 'annoyed', 'curious', 'love', 'winking', 'sleepy',
            'excited', 'dizzy', 'cool', 'crying', 'proud', 'nervous', 'sneaky', 'starstruck', 'sassy',
            'determined', 'relaxed', 'grumpy', 'zoned', 'whistling', 'glitch'];
        let expressionFadeTimer = null;
        function setExpression(expr) {
            const target = VALID_EXPRESSIONS.includes(expr) ? expr : 'normal';
            const newClass = `face expr-${target}`;
            if (face.className === newClass) return; // already showing this, skip re-trigger
            // Soft crossfade instead of an instant class-swap snap.
            clearTimeout(expressionFadeTimer);
            face.classList.add('expr-fade');
            expressionFadeTimer = setTimeout(() => {
                face.className = newClass;
                requestAnimationFrame(() => face.classList.remove('expr-fade'));
            }, 90);
        }

        // Blink loop
        setInterval(() => {
            if (isSleeping) return;
            face.classList.add('blink');
            setTimeout(() => face.classList.remove('blink'), 150);
        }, Math.random() * 3000 + 2000);

        function tapToWake() {
            // Triple-tap secret gesture always tracked (chahe soye ho ya jaage ho)
            handleFaceTap();
            if (isSleeping) {
                isSleeping = false;
                lastRealInteractionAt = Date.now();
                buddyMood = Math.max(0, buddyMood - 25);
                saveAiState();
                setExpression('surprised');
                enqueueCall("User ne tumhe screen par tap karke jagaya hai. Kuch funny bolo — morning voice wali vibe (thodi kharash wali sleepy tone ka text).");
            }
        }

        function initSystem() {
            document.getElementById('start-screen').style.display = 'none';
            logActivity('🔌 Buddy start hua.', 'system');
            window.speechSynthesis.speak(new SpeechSynthesisUtterance("")); // unlock browser TTS (fallback path)
            try { getTtsAudioCtx().resume(); } catch (e) {} // unlock Gemini TTS audio (autoplay policy)
            try { nativeSttInit(); } catch (e) {} // Android APK: native mic + camera permission yahin se shuru
            if (window.speechSynthesis.onvoiceschanged !== undefined) {
                window.speechSynthesis.onvoiceschanged = () => pickVoice();
            }

            (async () => {
                logActivity('🔎 Debug: Firebase read shuru.', 'system');
                let lastTime = null;
                try {
                    const snap = await Promise.race([
                        db.ref('buddy/last_offline').once('value'),
                        new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 5000))
                    ]);
                    lastTime = snap.val();
                    logActivity('🔎 Debug: Firebase read OK.', 'system');
                } catch (e) {
                    logActivity('⚠️ Debug: Firebase read FAIL — ' + safeStr(e && e.message), 'error');
                }
                let promptText = "Hello bolo. Main abhi online aaya hu.";
                if (lastTime) {
                    const diffHours = Math.floor((Date.now() - lastTime) / (1000 * 60 * 60));
                    if (diffHours >= 1) {
                        promptText = `Main ${diffHours} ghante baad wapas aaya hu. Is dauran mujhe kya miss hua hoga — agar kuch pata nahi toh mujhse puch sakte ho ("Itni der kahan the?"). Photo dekh kar bhi comment karo.`;
                    }
                }
                logActivity('🔎 Debug: photo lena shuru.', 'system');
                const photo = await takeSnapshot();
                logActivity('🔎 Debug: photo step khatam, AI call ja raha.', 'system');
                enqueueCall(promptText, { base64Image: photo, isSystemOverride: true });
                startObservationLoop();
            })();

            window.addEventListener('beforeunload', () => {
                db.ref('buddy/last_offline').set(Date.now());
                if (awaitingUserReply) recordIgnore();
            });
        }

        // Warm up voices (some browsers load async)
        if ('speechSynthesis' in window) window.speechSynthesis.getVoices();
    </script>
